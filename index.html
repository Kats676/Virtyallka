<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HyraIO</title>
    <style>
        /* ========== ОСНОВНЫЕ ПЕРЕМЕННЫЕ И СБРОС ========== */
        :root {
            --bg: #0a0a1a;
            --taskbar: rgba(10, 15, 30, 0.85);
            --window-bg: rgba(15, 20, 40, 0.95);
            --window-header: rgba(20, 30, 60, 0.95);
            --text: #d0d8f0;
            --accent: #4da8ff;
            --accent-glow: rgba(77, 168, 255, 0.4);
            --danger: #ff5c5c;
            --success: #4dff91;
            --warning: #ffb84d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: #050510;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            display: flex;
            flex-direction: column;
            /* Красивые синие обои */
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(20, 80, 200, 0.25) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 60%, rgba(15, 50, 150, 0.3) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(10, 30, 100, 0.2) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 80%, rgba(30, 100, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 10% 90%, rgba(0, 60, 180, 0.2) 0%, transparent 50%),
                linear-gradient(180deg, #050510 0%, #080e25 30%, #0a1030 60%, #060d20 100%);
            background-attachment: fixed;
            transition: background-image 0.5s;
        }

        /* Заражённый фон */
        body.virus-bg {
            background-image:
                radial-gradient(ellipse at 30% 30%, rgba(255, 0, 0, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 70%, rgba(200, 0, 0, 0.25) 0%, transparent 60%),
                linear-gradient(180deg, #1a0000 0%, #300000 100%) !important;
        }

        /* Лёгкий узор поверх обоев */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.003) 2px, rgba(255,255,255,0.003) 4px),
                        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,0.003) 2px, rgba(255,255,255,0.003) 4px);
            pointer-events: none;
            z-index: 0;
        }

        #watermark {
            position: fixed;
            bottom: 50px;
            right: 30px;
            color: rgba(255, 255, 255, 0.05);
            font-size: 80px;
            font-weight: 900;
            letter-spacing: 4px;
            z-index: 0;
            pointer-events: none;
            text-transform: uppercase;
        }

        #desktop {
            flex: 1;
            position: relative;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 1;
        }

        /* Иконки рабочего стола */
        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 8px 6px;
            width: 80px;
            text-align: center;
            color: #e0e8ff;
            font-size: 11px;
            gap: 4px;
            border-radius: 8px;
            transition: all 0.15s;
            position: relative;
            z-index: 1;
        }
        .desktop-icon:hover {
            background: rgba(77, 168, 255, 0.12);
            backdrop-filter: blur(8px);
        }
        .desktop-icon:active {
            background: rgba(77, 168, 255, 0.2);
        }
        .desktop-icon .icon-img {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            transition: transform 0.15s;
        }
        .desktop-icon:hover .icon-img {
            transform: scale(1.08);
        }
        .desktop-icon .icon-label {
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            line-height: 1.3;
            word-wrap: break-word;
            max-width: 75px;
        }

        /* ========== ОКНА ========== */
        .window {
            position: absolute;
            background: var(--window-bg);
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            min-width: 300px;
            min-height: 200px;
            z-index: 10;
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: windowOpen 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes windowOpen {
            from { opacity: 0; transform: scale(0.92) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .window.focused {
            z-index: 100;
            box-shadow: 0 25px 70px rgba(0,0,0,0.7), 0 0 0 1.5px var(--accent-glow), 0 0 20px rgba(77,168,255,0.1);
        }
        .window-header {
            background: var(--window-header);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: default;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            min-height: 38px;
        }
        .window-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
            color: #c0d0f0;
        }
        .window-controls {
            display: flex;
            gap: 6px;
        }
        .win-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c0d0f0;
            background: rgba(255,255,255,0.04);
            transition: all 0.15s;
        }
        .win-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        .win-btn.close:hover {
            background: var(--danger);
            color: #fff;
        }
        .win-btn.minimize:hover {
            background: var(--warning);
            color: #000;
        }
        .win-btn.maximize:hover {
            background: var(--success);
            color: #000;
        }

        .window-body {
            flex: 1;
            padding: 14px;
            overflow: auto;
            font-size: 13px;
            color: #c0d0f0;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
        }

        /* ========== ТАСКБАР ========== */
        #taskbar {
            background: var(--taskbar);
            height: 44px;
            display: flex;
            align-items: center;
            padding: 0 6px;
            gap: 4px;
            z-index: 200;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        #start-btn {
            background: rgba(77,168,255,0.15);
            border: 1px solid rgba(77,168,255,0.2);
            color: #e0e8ff;
            font-weight: 600;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            height: 32px;
            white-space: nowrap;
        }
        #start-btn:hover {
            background: rgba(77,168,255,0.25);
            box-shadow: 0 0 15px rgba(77,168,255,0.15);
        }
        #start-btn:active {
            background: rgba(77,168,255,0.35);
            transform: scale(0.97);
        }

        /* Quick Launch */
        #quick-launch {
            display: flex;
            gap: 2px;
            align-items: center;
            height: 34px;
            padding: 0 4px;
            border-right: 1px solid rgba(255,255,255,0.08);
            margin-right: 4px;
        }
        .quick-launch-icon {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
        }
        .quick-launch-icon:hover {
            background: rgba(255,255,255,0.08);
        }

        #taskbar-tasks {
            display: flex;
            gap: 3px;
            flex: 1;
            overflow-x: auto;
            height: 34px;
            align-items: center;
        }
        .taskbar-task {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: #c0d0f0;
            padding: 5px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            white-space: nowrap;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 30px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .taskbar-task:hover {
            background: rgba(255,255,255,0.08);
        }
        .taskbar-task.active {
            background: rgba(77,168,255,0.2);
            border-color: rgba(77,168,255,0.4);
            color: #fff;
            font-weight: 500;
        }
        .taskbar-task .task-icon {
            font-size: 13px;
        }

        #tray {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
            height: 30px;
            font-size: 11px;
            color: #b0c0e0;
            white-space: nowrap;
        }
        #tray .tray-time {
            font-weight: 500;
        }
        #tray .tray-date {
            color: #8090b0;
            font-size: 10px;
        }

        /* ========== МЕНЮ ПУСК ========== */
        #start-menu {
            position: absolute;
            bottom: 50px;
            left: 6px;
            background: rgba(15,20,40,0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 12px;
            padding: 8px;
            display: none;
            min-width: 220px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 300;
            animation: slideUp 0.15s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #start-menu.show {
            display: block;
        }
        .start-menu-item {
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #c0d0f0;
        }
        .start-menu-item:hover {
            background: rgba(77,168,255,0.15);
            color: #fff;
        }
        .start-menu-item .smi-icon {
            width: 22px;
            text-align: center;
            font-size: 15px;
        }
        .start-menu-separator {
            height: 1px;
            background: rgba(255,255,255,0.06);
            margin: 4px 8px;
        }
        .start-menu-footer {
            padding: 8px 14px;
            font-size: 10px;
            color: #6070a0;
            text-align: center;
            letter-spacing: 1px;
        }

        /* ========== КНОПКИ, ПОЛЯ ========== */
        .hyra-btn {
            background: rgba(77,168,255,0.15);
            border: 1px solid rgba(77,168,255,0.25);
            color: #d0e0ff;
            padding: 7px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }
        .hyra-btn:hover {
            background: rgba(77,168,255,0.25);
        }

        .hyra-input {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            color: #e0e8ff;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-family: inherit;
            outline: none;
            width: 100%;
        }
        .hyra-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(77,168,255,0.1);
        }

        /* ========== БЛОКНОТ ========== */
        .notepad-textarea {
            width: 100%;
            height: 100%;
            min-height: 180px;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            color: #d0d8f0;
            padding: 10px;
            font-family: 'Consolas', 'Fira Code', monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            line-height: 1.6;
        }
        .notepad-textarea:focus {
            border-color: var(--accent);
        }

        /* ========== ТЕРМИНАЛ (iPad friendly) ========== */
        .terminal-output {
            background: rgba(0,0,0,0.4);
            color: #b0d0ff;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            padding: 10px;
            height: calc(100% - 38px);
            overflow-y: auto;
            white-space: pre-wrap;
            border-radius: 6px 6px 0 0;
            border: 1px solid rgba(255,255,255,0.06);
            border-bottom: none;
        }
        .terminal-input-line {
            display: flex;
            background: rgba(0,0,0,0.4);
            padding: 6px 10px;
            border-radius: 0 0 6px 6px;
            border: 1px solid rgba(255,255,255,0.06);
            border-top: none;
            align-items: center;
            cursor: text;
        }
        .terminal-prompt {
            color: var(--accent);
            font-family: 'Consolas', monospace;
            font-size: 13px;
            margin-right: 6px;
            white-space: nowrap;
        }
        .terminal-input {
            background: transparent;
            border: none;
            color: #e0e8ff;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            outline: none;
            flex: 1;
            caret-color: var(--accent);
        }

        /* ========== ПРОВОДНИК ========== */
        .explorer-item {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 4px;
            gap: 8px;
            font-size: 12px;
            white-space: nowrap;
        }
        .explorer-item:hover {
            background: rgba(255,255,255,0.05);
        }
        .explorer-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }
        .explorer-address {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            color: #c0d0f0;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .explorer-back {
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 14px;
        }

        /* ========== ВИРУСНОЕ УВЕДОМЛЕНИЕ ========== */
        .virus-alert {
            position: fixed;
            top: 20px;
            right: 20px;
            background: red;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            z-index: 999;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="watermark">HyraIO</div>
    <div class="virus-alert" id="virusAlert">⚠️ ВИРУС ОБНАРУЖЕН! Система заражена!</div>

    <!-- РАБОЧИЙ СТОЛ -->
    <div id="desktop">
        <div class="desktop-icon" data-app="my-pc" ondblclick="openApp('my-pc')">
            <div class="icon-img">🖥️</div>
            <div class="icon-label">Этот компьютер</div>
        </div>
        <div class="desktop-icon" data-app="recycle" ondblclick="openApp('recycle')">
            <div class="icon-img">🗑️</div>
            <div class="icon-label">Корзина</div>
        </div>
        <div class="desktop-icon" data-app="notepad" ondblclick="openApp('notepad')">
            <div class="icon-img">📝</div>
            <div class="icon-label">Блокнот</div>
        </div>
        <div class="desktop-icon" data-app="terminal" ondblclick="openApp('terminal')">
            <div class="icon-img">⚡</div>
            <div class="icon-label">Терминал</div>
        </div>
        <div class="desktop-icon" data-app="hyrabr" ondblclick="openApp('hyrabr')">
            <div class="icon-img">🌐</div>
            <div class="icon-label">HYRABR</div>
        </div>
    </div>

    <!-- МЕНЮ ПУСК -->
    <div id="start-menu">
        <div class="start-menu-item" onclick="openApp('my-pc'); toggleStartMenu()">
            <span class="smi-icon">🖥️</span> Этот компьютер
        </div>
        <div class="start-menu-item" onclick="openApp('hyrabr'); toggleStartMenu()">
            <span class="smi-icon">🌐</span> HYRABR
        </div>
        <div class="start-menu-item" onclick="openApp('notepad'); toggleStartMenu()">
            <span class="smi-icon">📝</span> Блокнот
        </div>
        <div class="start-menu-item" onclick="openApp('terminal'); toggleStartMenu()">
            <span class="smi-icon">⚡</span> Терминал
        </div>
        <div class="start-menu-separator"></div>
        <div class="start-menu-item" onclick="shutdown()">
            <span class="smi-icon">⏻</span> Завершение работы
        </div>
        <div class="start-menu-footer">HyraIO v1.0</div>
    </div>

    <!-- ПАНЕЛЬ ЗАДАЧ -->
    <div id="taskbar">
        <button id="start-btn" onclick="toggleStartMenu()"><span>⊞</span> Пуск</button>

        <!-- Quick Launch -->
        <div id="quick-launch">
            <div class="quick-launch-icon" title="Этот компьютер" onclick="openApp('my-pc')">🖥️</div>
            <div class="quick-launch-icon" title="HYRABR" onclick="openApp('hyrabr')">🌐</div>
            <div class="quick-launch-icon" title="Блокнот" onclick="openApp('notepad')">📝</div>
            <div class="quick-launch-icon" title="Терминал" onclick="openApp('terminal')">⚡</div>
        </div>

        <div id="taskbar-tasks"></div>

        <div id="tray">
            <span class="tray-time" id="clock">00:00</span>
            <span class="tray-date" id="date-display"></span>
        </div>
    </div>

    <script>
        // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
        let windows = {};
        let windowZIndex = 10;
        let activeWindowId = null;
        let windowCount = 0;
        let startMenuOpen = false;
        let minimizedWindows = {};
        let extraDrives = [];
        let virusDetected = false;
        let installedAV = null;

        // ========== ЧАСЫ ==========
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent =
                `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            document.getElementById('date-display').textContent =
                now.toLocaleDateString('ru-RU', { day:'numeric', month:'short', year:'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ========== МЕНЮ ПУСК ==========
        function toggleStartMenu() {
            startMenuOpen = !startMenuOpen;
            document.getElementById('start-menu').classList.toggle('show', startMenuOpen);
        }
        document.addEventListener('click', (e) => {
            if (!startMenuOpen) return;
            const menu = document.getElementById('start-menu');
            const btn = document.getElementById('start-btn');
            if (!menu.contains(e.target) && e.target !== btn) {
                startMenuOpen = false;
                menu.classList.remove('show');
            }
        });

        // ========== УПРАВЛЕНИЕ ОКНАМИ ==========
        function createWindowElement(id, title, icon='📄', width=520, height=400) {
            const win = document.createElement('div');
            win.className = 'window';
            win.id = `window-${id}`;
            win.style.left = `${50 + (windowCount * 30) % 350}px`;
            win.style.top  = `${50 + (windowCount * 30) % 250}px`;
            win.style.width = width + 'px';
            win.style.height = height + 'px';
            win.style.zIndex = ++windowZIndex;
            win.innerHTML = `
                <div class="window-header" data-window-id="${id}">
                    <span class="window-title"><span class="win-icon">${icon}</span> ${title}</span>
                    <div class="window-controls">
                        <button class="win-btn minimize" data-action="minimize">─</button>
                        <button class="win-btn maximize" data-action="maximize">□</button>
                        <button class="win-btn close" data-action="close">✕</button>
                    </div>
                </div>
                <div class="window-body" id="body-${id}"></div>
            `;
            document.body.appendChild(win);
            windowCount++;

            // Управление кнопками
            win.querySelectorAll('.win-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const action = btn.dataset.action;
                    if (action === 'close') closeWindow(id);
                    if (action === 'minimize') minimizeWindow(id);
                    if (action === 'maximize') maximizeWindow(id);
                });
            });

            // Фокус при клике на окно
            win.addEventListener('mousedown', () => focusWindow(id));

            // Перетаскивание
            const header = win.querySelector('.window-header');
            let isDragging = false, offsetX, offsetY;
            header.addEventListener('mousedown', (e) => {
                if (e.target.closest('.win-btn')) return;
                isDragging = true;
                const rect = win.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                win.style.left = `${e.clientX - offsetX}px`;
                win.style.top  = `${e.clientY - offsetY}px`;
            });
            document.addEventListener('mouseup', () => { isDragging = false; });

            // Touch-перетаскивание для iPad
            header.addEventListener('touchstart', (e) => {
                if (e.target.closest('.win-btn')) return;
                isDragging = true;
                const rect = win.getBoundingClientRect();
                offsetX = e.touches[0].clientX - rect.left;
                offsetY = e.touches[0].clientY - rect.top;
            }, {passive: false});
            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                win.style.left = `${e.touches[0].clientX - offsetX}px`;
                win.style.top  = `${e.touches[0].clientY - offsetY}px`;
            }, {passive: false});
            document.addEventListener('touchend', () => { isDragging = false; });

            return win;
        }

        function focusWindow(id) {
            if (activeWindowId === id) return;
            activeWindowId = id;
            document.querySelectorAll('.window').forEach(w => w.classList.remove('focused'));
            const win = document.getElementById(`window-${id}`);
            if (win) {
                win.classList.add('focused');
                win.style.zIndex = ++windowZIndex;
            }
            updateTaskbar();
        }

        function closeWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if (win) {
                win.remove();
                windowCount--;
                delete windows[id];
                delete minimizedWindows[id];
                if (activeWindowId === id) activeWindowId = null;
                updateTaskbar();
            }
        }

        function minimizeWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if (win) {
                win.style.display = 'none';
                minimizedWindows[id] = true;
                if (activeWindowId === id) activeWindowId = null;
                updateTaskbar();
            }
        }

        function maximizeWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if (!win) return;
            if (win.style.width === '100%') {
                win.style.width = '520px';
                win.style.height = '400px';
                win.style.left = '50px';
                win.style.top = '50px';
                win.style.borderRadius = '10px';
            } else {
                win.style.width = '100%';
                win.style.height = 'calc(100% - 44px)';
                win.style.left = '0';
                win.style.top = '0';
                win.style.borderRadius = '0';
            }
        }

        function restoreWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if (win && win.style.display === 'none') {
                win.style.display = 'flex';
                delete minimizedWindows[id];
                focusWindow(id);
                updateTaskbar();
            }
        }

        function updateTaskbar() {
            const container = document.getElementById('taskbar-tasks');
            container.innerHTML = '';

            const allIds = new Set();
            document.querySelectorAll('.window').forEach(w => allIds.add(w.id.replace('window-','')));
            Object.keys(minimizedWindows).forEach(id => allIds.add(id));

            const titles = {
                'my-pc':'Этот компьютер', 'recycle':'Корзина', 'notepad':'Блокнот',
                'terminal':'Терминал', 'hyrabr':'HYRABR'
            };
            const icons = {
                'my-pc':'🖥️', 'recycle':'🗑️', 'notepad':'📝', 'terminal':'⚡', 'hyrabr':'🌐'
            };

            allIds.forEach(id => {
                let title = titles[id] || '';
                let icon = icons[id] || '📄';
                if (id.startsWith('disk-')) {
                    icon = '💾';
                    const letter = id.split('-')[1];
                    title = `Диск (${letter}:)`;
                }

                const isMinimized = !!minimizedWindows[id];
                const isActive = (activeWindowId === id && !isMinimized);

                const task = document.createElement('div');
                task.className = `taskbar-task${isActive ? ' active' : ''}`;
                task.innerHTML = `<span class="task-icon">${icon}</span> ${title.substring(0,16)}`;
                task.onclick = () => {
                    if (isMinimized) restoreWindow(id);
                    else if (isActive) minimizeWindow(id);
                    else { restoreWindow(id); focusWindow(id); }
                };
                container.appendChild(task);
            });
        }

        // ========== ФАЙЛОВАЯ СИСТЕМА ==========
        function generateFile(name, size, date = '01.01.2025') {
            return { type: 'file', name, size, date };
        }

            const root = {

                        'drivers': {
                            type: 'folder',
                            children: {
                                'hyrdisk.sys': generateFile('hyrdisk.sys', '128 KB', '22.06.2025'),
                                'hyrnet.sys': generateFile('hyrnet.sys', '96 KB', '22.06.2025'),
                            }
                        },
                        'config': { type: 'folder', children: {} },
                        'hyraapi.dll': generateFile('hyraapi.dll', '1.1 MB', '22.06.2025'),

            };

            if (letter === 'C') {
                // Диск C: получает полную структуру
                Object.assign(root.children, commonFolders);
                root.children['System Volume Information'] = { type: 'folder', children: {} };
                root.children['$Recycle.Bin'] = { type: 'folder', children: {} };
            } else {
                // Другие диски – минимальный набор
                root.children = {
                    'autoexec.bat': root.children['autoexec.bat'],
                    'config.sys': root.children['config.sys'],
                    'Documents': { type: 'folder', children: {} },
                    'Downloads': { type: 'folder', children: {} },

        // Глобальная ФС
        let fileSystem = {
            'C': createDriveStructure('C')
        };

        function getDriveStructure(letter) {
            if (!fileSystem[letter]) {
                fileSystem[letter] = createDriveStructure(letter);
            }
            return fileSystem[letter];
        }

        function resolvePath(letter, pathStr) {
            let drive = getDriveStructure(letter);
            if (pathStr === '' || pathStr === letter + ':\\') return drive;
            let parts = pathStr.replace(letter + ':\\', '').split('\\').filter(p => p);
            let current = drive;
            for (let part of parts) {
                if (current.children && current.children[part]) {
                    current = current.children[part];
                } else {
                    return null;
                }
            }
            return current;
        }

        // ========== РЕНДЕРИНГ ПРОВОДНИКА ==========
        function renderFolderContents(containerId, letter, path) {
            const folder = resolvePath(letter, path);
            if (!folder || folder.type !== 'folder') {
                return '<p>Папка не найдена.</p>';
            }

            let html = `
                <div class="explorer-toolbar">
                    <span class="explorer-back" onclick="navigateUp('${containerId}')">⬆️</span>
                    <div class="explorer-address">${path}</div>
                </div>
                <div style="display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start;">
            `;

            const children = folder.children || {};
            const entries = Object.entries(children).sort((a, b) => {
                if (a[1].type === b[1].type) return a[0].localeCompare(b[0]);
                return a[1].type === 'folder' ? -1 : 1;
            });

            for (let [name, item] of entries) {
                if (item.type === 'folder') {
                    html += `
                        <div class="explorer-item" style="flex-direction:column; width:85px; padding:8px; text-align:center;"
                             ondblclick="navigateToFolder('${containerId}', '${name}')">
                            <div style="font-size:28px;">📁</div>
                            <div style="font-size:11px; word-wrap:break-word;">${name}</div>
                        </div>`;
                } else {
                    let icon = '📄';
                    if (name.endsWith('.exe')) icon = '⚙️';
                    else if (name.endsWith('.dll')) icon = '🔧';
                    else if (name.endsWith('.sys')) icon = '💾';
                    else if (name.endsWith('.txt') || name.endsWith('.ini') || name.endsWith('.log')) icon = '📝';
                    else if (name.endsWith('.com') || name.endsWith('.bat')) icon = '▶️';

                    html += `
                        <div class="explorer-item" style="flex-direction:column; width:85px; padding:8px; text-align:center;">
                            <div style="font-size:28px;">${icon}</div>
                            <div style="font-size:10px; word-wrap:break-word;">${name}</div>
                            <div style="font-size:9px; color:#8090b0;">${item.size}</div>
                        </div>`;
                }
            }

            html += `</div>`;
            return html;
        }

        function navigateToFolder(containerId, folderName) {
            const body = document.getElementById('body-' + containerId);
            if (!body) return;
            let currentPath = body.getAttribute('data-path') || '';
            let letter = containerId.split('-')[1]; // disk-C -> C
            let newPath = currentPath ? `${currentPath}\\${folderName}` : `${letter}:\\${folderName}`;
            body.innerHTML = renderFolderContents(containerId, letter, newPath);
            body.setAttribute('data-path', newPath);
        }

        function navigateUp(containerId) {
            const body = document.getElementById('body-' + containerId);
            if (!body) return;
            let currentPath = body.getAttribute('data-path') || '';
            let letter = containerId.split('-')[1];
            if (!currentPath || currentPath === letter + ':\\') return;
            let parts = currentPath.split('\\');
            parts.pop();
            let newPath = parts.join('\\');
            if (newPath === letter + ':') newPath = letter + ':\\';
            body.innerHTML = renderFolderContents(containerId, letter, newPath);
            body.setAttribute('data-path', newPath);
        }

Введите 'help' для списка команд.

C:\\Users\\Hyra><span style="color:var(--accent);">_</span>

        // ========== ЗАПУСК ПРИЛОЖЕНИЙ ==========
        function openApp(appId) {
            if (minimizedWindows[appId]) { restoreWindow(appId); return; }
            if (windows[appId]) {
                const win = document.getElementById(`window-${appId}`);
                if (win && win.style.display !== 'none') {
                    focusWindow(appId);
                    return;
                }

            const titles = {

            };

            let title, icon;
            if (appId.startsWith('disk-')) {
                const letter = appId.split('-')[1];
                title = `Локальный диск (${letter}:)`;
                icon = '💾';

                title = titles[appId] || appId;
                icon = icons[appId] || '📄';
            }

            const width = appId === 'hyrabr' ? 700 : 520;
            const height = appId === 'hyrabr' ? 500 : 400;
            const win = createWindowElement(appId, title, icon, width, height);
            const body = win.querySelector('.window-body');
            body.innerHTML = getAppContent(appId);

            if (appId.startsWith('disk-')) {
                const letter = appId.split('-')[1];
                body.setAttribute('data-path', letter + ':\\');

            windows[appId] = true;
            delete minimizedWindows[appId];
            focusWindow(appId);
            updateTaskbar();

            if (appId === 'terminal') setupTerminal(appId);
            if (startMenuOpen) toggleStartMenu();

        // ========== ТЕРМИНАЛ ==========

                else if (cmd !== '') output.innerHTML += `\n"${input.value}" не является командой.`;
                output.innerHTML += '\n\nC:\\Users\\Hyra><span style="color:var(--accent);">_</span>';
                output.scrollTop = output.scrollHeight;
                input.value = '';
                input.focus();
            });

            setTimeout(() => input.focus(), 100);
        }

        // ========== ЗАВЕРШЕНИЕ РАБОТЫ ==========
        function shutdown() {
            document.body.innerHTML = `
                <div style="background:#050510; display:flex; align-items:center; justify-content:center; height:100vh; flex-direction:column; color:#e0e8ff;

                        <button class="hyra-btn" style="margin-top:20px;" onclick="location.reload()">Перезапустить</button>
                    </div>
                </div>`;
        }

        // ========== ГОРЯЧИЕ КЛАВИШИ ==========
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && activeWindowId) {
                minimizeWindow(activeWindowId);
            }
        });

        console.log('🔥 HyraIO OS v1.0 — Полная версия с HYRABR, антивирусами, вирусами и проводником');
    </script>
