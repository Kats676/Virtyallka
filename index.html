<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HyraIO</title>
    <style>
        :root {
            --bg: #0a0a1a;
            --taskbar: rgba(10, 15, 30, 0.85);
            --window-bg: rgba(15, 20, 40, 0.95);
            --window-header: rgba(20, 30, 60, 0.95);
            --text: #d0d8f0;
            --accent: #4da8ff;
            --accent-glow: rgba(77, 168, 255, 0.4);
            --danger: #ff5c5c;
            --success: #4dff91;
            --warning: #ffb84d;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: #050510;
            height:100vh; width:100vw; overflow:hidden;
            display:flex; flex-direction:column;
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(20,80,200,0.25) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 60%, rgba(15,50,150,0.3) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(10,30,100,0.2) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 80%, rgba(30,100,255,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 10% 90%, rgba(0,60,180,0.2) 0%, transparent 50%),
                linear-gradient(180deg, #050510 0%, #080e25 30%, #0a1030 60%, #060d20 100%);
            background-attachment: fixed;
            transition: background-image 0.5s;
        }
        body.virus-bg {
            background-image:
                radial-gradient(ellipse at 30% 30%, rgba(255,0,0,0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 70%, rgba(200,0,0,0.25) 0%, transparent 60%),
                linear-gradient(180deg, #1a0000 0%, #300000 100%) !important;
        }
        body::before {
            content:''; position:fixed; top:0; left:0; width:100%; height:100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.003) 2px, rgba(255,255,255,0.003) 4px),
                        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,0.003) 2px, rgba(255,255,255,0.003) 4px);
            pointer-events:none; z-index:0;
        }
        #watermark { position:fixed; bottom:50px; right:30px; color:rgba(255,255,255,0.05); font-size:80px; font-weight:900; letter-spacing:4px; z-index:0; pointer-events:none; text-transform:uppercase; }
        #desktop { flex:1; position:relative; padding:15px; display:flex; flex-direction:column; gap:6px; z-index:1; }
        .desktop-icon {
            display:flex; flex-direction:column; align-items:center; cursor:pointer;
            padding:8px 6px; width:80px; text-align:center; color:#e0e8ff; font-size:11px;
            gap:4px; border-radius:8px; transition:all 0.15s; position:relative; z-index:1;
        }
        .desktop-icon:hover { background:rgba(77,168,255,0.12); backdrop-filter:blur(8px); }
        .desktop-icon:active { background:rgba(77,168,255,0.2); }
        .desktop-icon .icon-img { width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:28px; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .desktop-icon .icon-label { text-shadow:0 1px 3px rgba(0,0,0,0.9); line-height:1.3; word-wrap:break-word; max-width:75px; }

        /* Окна */
        .window {
            position:absolute; background:var(--window-bg); border-radius:10px;
            box-shadow:0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
            display:flex; flex-direction:column; min-width:300px; min-height:200px;
            z-index:10; overflow:hidden; backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            animation:windowOpen 0.2s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes windowOpen { from{opacity:0;transform:scale(0.92) translateY(15px);} to{opacity:1;transform:scale(1) translateY(0);} }
        .window.focused { z-index:100; box-shadow:0 25px 70px rgba(0,0,0,0.7), 0 0 0 1.5px var(--accent-glow); }
        .window-header {
            background:var(--window-header); padding:10px 14px;
            display:flex; align-items:center; justify-content:space-between;
            cursor:default; border-bottom:1px solid rgba(255,255,255,0.05); min-height:38px;
        }
        .window-title { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:500; color:#c0d0f0; }
        .window-controls { display:flex; gap:6px; }
        .win-btn {
            width:28px; height:28px; border-radius:6px; border:none;
            cursor:pointer; font-size:11px; display:flex; align-items:center; justify-content:center;
            color:#c0d0f0; background:rgba(255,255,255,0.04); transition:all 0.15s;
        }
        .win-btn:hover { background:rgba(255,255,255,0.1); }
        .win-btn.close:hover { background:var(--danger); color:#fff; }
        .win-btn.minimize:hover { background:var(--warning); color:#000; }
        .win-btn.maximize:hover { background:var(--success); color:#000; }
        .window-body { flex:1; padding:14px; overflow:auto; font-size:13px; color:#c0d0f0; line-height:1.5; display:flex; flex-direction:column; }

        /* Таскбар */
        #taskbar {
            background:var(--taskbar); height:44px; display:flex; align-items:center;
            padding:0 6px; gap:4px; z-index:200; backdrop-filter:blur(25px);
            -webkit-backdrop-filter:blur(25px); border-top:1px solid rgba(255,255,255,0.08);
        }
        #start-btn {
            background:rgba(77,168,255,0.15); border:1px solid rgba(77,168,255,0.2);
            color:#e0e8ff; font-weight:600; font-size:12px; padding:6px 14px;
            border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:6px;
            height:32px; white-space:nowrap;
        }
        #quick-launch { display:flex; gap:2px; align-items:center; height:34px; padding:0 4px; border-right:1px solid rgba(255,255,255,0.08); margin-right:4px; }
        .quick-launch-icon { width:30px; height:30px; display:flex; align-items:center; justify-content:center; font-size:18px; border-radius:6px; cursor:pointer; }
        .quick-launch-icon:hover { background:rgba(255,255,255,0.08); }
        #taskbar-tasks { display:flex; gap:3px; flex:1; overflow-x:auto; height:34px; align-items:center; }
        .taskbar-task {
            background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06);
            color:#c0d0f0; padding:5px 14px; border-radius:6px; cursor:pointer;
            font-size:11px; white-space:nowrap; max-width:160px; overflow:hidden; text-overflow:ellipsis;
            height:30px; display:flex; align-items:center; gap:6px;
        }
        .taskbar-task.active { background:rgba(77,168,255,0.2); border-color:rgba(77,168,255,0.4); color:#fff; font-weight:500; }
        #tray { display:flex; align-items:center; gap:10px; padding:0 10px; height:30px; font-size:11px; color:#b0c0e0; white-space:nowrap; }
        #tray .tray-time { font-weight:500; }
        #tray .tray-date { color:#8090b0; font-size:10px; }

        /* Меню Пуск */
        #start-menu {
            position:absolute; bottom:50px; left:6px;
            background:rgba(15,20,40,0.95); backdrop-filter:blur(30px);
            border-radius:12px; padding:8px; display:none;
            min-width:220px; box-shadow:0 20px 50px rgba(0,0,0,0.7);
            border:1px solid rgba(255,255,255,0.08); z-index:300;
            animation:slideUp 0.15s ease-out;
        }
        @keyframes slideUp { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
        #start-menu.show { display:block; }
        .start-menu-item { padding:9px 14px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:10px; font-size:12px; color:#c0d0f0; }
        .start-menu-item:hover { background:rgba(77,168,255,0.15); color:#fff; }
        .start-menu-separator { height:1px; background:rgba(255,255,255,0.06); margin:4px 8px; }
        .start-menu-footer { padding:8px 14px; font-size:10px; color:#6070a0; text-align:center; letter-spacing:1px; }

        /* Элементы */
        .hyra-btn { background:rgba(77,168,255,0.15); border:1px solid rgba(77,168,255,0.25); color:#d0e0ff; padding:7px 18px; border-radius:6px; cursor:pointer; font-size:12px; }
        .hyra-btn:hover { background:rgba(77,168,255,0.25); }
        .hyra-input { background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); color:#e0e8ff; padding:7px 12px; border-radius:6px; font-size:12px; outline:none; width:100%; }
        .notepad-textarea { width:100%; height:100%; min-height:180px; background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.08); border-radius:6px; color:#d0d8f0; padding:10px; font-family:'Consolas',monospace; font-size:13px; resize:none; outline:none; }
        .terminal-output { background:rgba(0,0,0,0.4); color:#b0d0ff; font-family:'Consolas',monospace; font-size:13px; padding:10px; height:calc(100% - 38px); overflow-y:auto; white-space:pre-wrap; border-radius:6px 6px 0 0; border:1px solid rgba(255,255,255,0.06); border-bottom:none; }
        .terminal-input-line { display:flex; background:rgba(0,0,0,0.4); padding:6px 10px; border-radius:0 0 6px 6px; border:1px solid rgba(255,255,255,0.06); border-top:none; align-items:center; cursor:text; }
        .terminal-prompt { color:var(--accent); font-family:'Consolas',monospace; font-size:13px; margin-right:6px; white-space:nowrap; }
        .terminal-input { background:transparent; border:none; color:#e0e8ff; font-family:'Consolas',monospace; font-size:13px; outline:none; flex:1; caret-color:var(--accent); }

        /* Поиск HYRABR */
        .search-result { padding:12px; margin:6px 0; background:rgba(255,255,255,0.03); border-radius:8px; cursor:pointer; transition:background 0.2s; }
        .search-result:hover { background:rgba(255,255,255,0.06); }
        .search-result .url { color:#8090b0; font-size:11px; }
        .search-result .title { color:#8ab4f8; font-size:18px; font-weight:500; }
        .search-result .desc { color:#b0b0b0; font-size:13px; margin-top:2px; }
        .search-widget { background:rgba(255,255,255,0.05); border-radius:12px; padding:16px; margin-bottom:12px; }

        /* Вирус */
        .virus-alert { position:fixed; top:20px; right:20px; background:red; color:white; padding:15px 25px; border-radius:8px; z-index:999; display:none; font-weight:bold; box-shadow:0 10px 30px rgba(255,0,0,0.5); }
        .bsod { background:#0000aa; color:white; font-family:'Courier New',monospace; padding:30px; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
        .bsod h1 { font-size:48px; margin-bottom:20px; }
        .bsod p { font-size:16px; margin:5px 0; }

        /* Контекстное меню */
        .context-menu { position:fixed; background:rgba(20,25,45,0.95); border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,0.7); z-index:500; display:none; min-width:150px; padding:4px; }
        .context-menu-item { padding:8px 16px; cursor:pointer; font-size:12px; color:#ccc; }
        .context-menu-item:hover { background:rgba(77,168,255,0.2); color:#fff; }
    </style>
</head>
<body>
    <div id="watermark">HyraIO</div>
    <div class="virus-alert" id="virusAlert">⚠️ ВИРУС ОБНАРУЖЕН! Система заражена!</div>
    <div class="context-menu" id="contextMenu"></div>

    <div id="desktop">
        <div class="desktop-icon" data-app="my-pc" ondblclick="openApp('my-pc')"><div class="icon-img">🖥️</div><div class="icon-label">Этот компьютер</div></div>
        <div class="desktop-icon" data-app="recycle" ondblclick="openApp('recycle')"><div class="icon-img">🗑️</div><div class="icon-label">Корзина</div></div>
        <div class="desktop-icon" data-app="notepad" ondblclick="openApp('notepad')"><div class="icon-img">📝</div><div class="icon-label">Блокнот</div></div>
        <div class="desktop-icon" data-app="terminal" ondblclick="openApp('terminal')"><div class="icon-img">⚡</div><div class="icon-label">Терминал</div></div>
        <div class="desktop-icon" data-app="hyrabr" ondblclick="openApp('hyrabr')"><div class="icon-img">🌐</div><div class="icon-label">HYRABR</div></div>
        <div class="desktop-icon" data-app="hyradef" ondblclick="openApp('hyradef')"><div class="icon-img">🛡️</div><div class="icon-label">HyraDeF</div></div>
        <div class="desktop-icon" data-app="calc" ondblclick="openApp('calc')"><div class="icon-img">🔢</div><div class="icon-label">Калькулятор</div></div>
    </div>

    <div id="start-menu">
        <div class="start-menu-item" onclick="openApp('my-pc');toggleStartMenu()">🖥️ Этот компьютер</div>
        <div class="start-menu-item" onclick="openApp('hyrabr');toggleStartMenu()">🌐 HYRABR</div>
        <div class="start-menu-item" onclick="openApp('hyradef');toggleStartMenu()">🛡️ HyraDeF</div>
        <div class="start-menu-item" onclick="openApp('terminal');toggleStartMenu()">⚡ Терминал</div>
        <div class="start-menu-item" onclick="openApp('calc');toggleStartMenu()">🔢 Калькулятор</div>
        <div class="start-menu-separator"></div>
        <div class="start-menu-item" onclick="shutdown()">⏻ Завершение работы</div>
    </div>

    <div id="taskbar">
        <button id="start-btn" onclick="toggleStartMenu()">⊞ Пуск</button>
        <div id="quick-launch">
            <span class="quick-launch-icon" onclick="openApp('my-pc')">🖥️</span>
            <span class="quick-launch-icon" onclick="openApp('hyrabr')">🌐</span>
            <span class="quick-launch-icon" onclick="openApp('hyradef')">🛡️</span>
        </div>
        <div id="taskbar-tasks"></div>
        <div id="tray"><span class="tray-time" id="clock">00:00</span><span class="tray-date" id="date"></span></div>
    </div>

    <script>
        // ========== ГЛОБАЛЬНЫЕ СОСТОЯНИЯ ==========
        let windows = {}, windowZIndex = 10, activeWindowId = null, minimizedWindows = {}, startMenuOpen = false;
        let virusDetected = false, installedAV = null, hyradefTimeout = null;
        let extraDrives = [];
        let contextMenuTarget = null;

        // ========== ЧАСЫ ==========
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            document.getElementById('date').textContent = now.toLocaleDateString('ru-RU', { day:'numeric', month:'short', year:'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ========== МЕНЮ ПУСК ==========
        function toggleStartMenu() {
            startMenuOpen = !startMenuOpen;
            document.getElementById('start-menu').classList.toggle('show', startMenuOpen);
        }
        document.addEventListener('click', (e) => {
            if (!startMenuOpen) return;
            if (!e.target.closest('#start-menu') && e.target !== document.getElementById('start-btn')) {
                startMenuOpen = false;
                document.getElementById('start-menu').classList.remove('show');
            }
        });

        // ========== КОНТЕКСТНОЕ МЕНЮ ==========
        function showContextMenu(e, targetId) {
            e.preventDefault();
            const menu = document.getElementById('contextMenu');
            menu.style.display = 'block';
            menu.style.left = e.clientX + 'px';
            menu.style.top = e.clientY + 'px';
            contextMenuTarget = targetId;
            menu.innerHTML = `
                <div class="context-menu-item" onclick="openApp('${targetId}')">Открыть</div>
                <div class="context-menu-item" onclick="closeContextMenu()">Отмена</div>
            `;
            setTimeout(() => document.addEventListener('click', closeContextMenu, {once:true}), 0);
        }
        function closeContextMenu() {
            document.getElementById('contextMenu').style.display = 'none';
        }
        document.querySelectorAll('.desktop-icon').forEach(icon => {
            icon.addEventListener('contextmenu', (e) => showContextMenu(e, icon.dataset.app));
        });

        // ========== УПРАВЛЕНИЕ ОКНАМИ ==========
        function createWindow(id, title, icon='📄', width=500, height=400) {
            const win = document.createElement('div');
            win.className = 'window';
            win.id = `window-${id}`;
            win.style.left = `${60 + Object.keys(windows).length * 30}px`;
            win.style.top = `${60 + Object.keys(windows).length * 30}px`;
            win.style.width = width + 'px';
            win.style.height = height + 'px';
            win.style.zIndex = ++windowZIndex;
            win.innerHTML = `
                <div class="window-header">
                    <span class="window-title"><span class="win-icon">${icon}</span> ${title}</span>
                    <div class="window-controls">
                        <button class="win-btn minimize" data-action="minimize">─</button>
                        <button class="win-btn maximize" data-action="maximize">□</button>
                        <button class="win-btn close" data-action="close">✕</button>
                    </div>
                </div>
                <div class="window-body" id="body-${id}"></div>`;
            document.body.appendChild(win);
            windows[id] = true;

            win.querySelectorAll('.win-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const action = btn.dataset.action;
                    if (action === 'close') closeWindow(id);
                    else if (action === 'minimize') minimizeWindow(id);
                    else if (action === 'maximize') maximizeWindow(id);
                });
            });

            win.addEventListener('mousedown', () => focusWindow(id));

            // Drag
            const header = win.querySelector('.window-header');
            let dragging = false, ox, oy;
            header.addEventListener('mousedown', (e) => {
                if (e.target.closest('.win-btn')) return;
                dragging = true;
                const rect = win.getBoundingClientRect();
                ox = e.clientX - rect.left;
                oy = e.clientY - rect.top;
            });
            document.addEventListener('mousemove', (e) => {
                if (!dragging) return;
                win.style.left = `${e.clientX - ox}px`;
                win.style.top = `${e.clientY - oy}px`;
            });
            document.addEventListener('mouseup', () => { dragging = false; });

            // Touch
            header.addEventListener('touchstart', (e) => {
                if (e.target.closest('.win-btn')) return;
                dragging = true;
                const rect = win.getBoundingClientRect();
                ox = e.touches[0].clientX - rect.left;
                oy = e.touches[0].clientY - rect.top;
            }, {passive: false});
            document.addEventListener('touchmove', (e) => {
                if (!dragging) return;
                e.preventDefault();
                win.style.left = `${e.touches[0].clientX - ox}px`;
                win.style.top = `${e.touches[0].clientY - oy}px`;
            }, {passive: false});
            document.addEventListener('touchend', () => { dragging = false; });

            return win;
        }

        function focusWindow(id) {
            if (activeWindowId === id) return;
            activeWindowId = id;
            document.querySelectorAll('.window').forEach(w => w.classList.remove('focused'));
            document.getElementById(`window-${id}`)?.classList.add('focused');
            updateTaskbar();
        }
        function closeWindow(id) {
            document.getElementById(`window-${id}`)?.remove();
            delete windows[id];
            if (activeWindowId === id) activeWindowId = null;
            updateTaskbar();
        }
        function minimizeWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if (win) { win.style.display = 'none'; minimizedWindows[id] = true; if (activeWindowId === id) activeWindowId = null; }
            updateTaskbar();
        }
        function maximizeWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if (!win) return;
            if (win.style.width === '100%') {
                win.style.width = '520px'; win.style.height = '400px'; win.style.left = '60px'; win.style.top = '60px';
            } else {
                win.style.width = '100%'; win.style.height = 'calc(100% - 44px)'; win.style.left = '0'; win.style.top = '0';
            }
        }
        function restoreWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if (win && win.style.display === 'none') { win.style.display = 'flex'; delete minimizedWindows[id]; focusWindow(id); updateTaskbar(); }
        }
        function updateTaskbar() {
            const tasks = document.getElementById('taskbar-tasks');
            tasks.innerHTML = '';
            const allIds = new Set();
            document.querySelectorAll('.window').forEach(w => allIds.add(w.id.replace('window-','')));
            Object.keys(minimizedWindows).forEach(id => allIds.add(id));
            const titles = { 'my-pc':'ПК', 'hyrabr':'HYRABR', 'hyradef':'HyraDeF', 'notepad':'Блокнот', 'terminal':'Терминал', 'calc':'Калькулятор' };
            const icons = { 'my-pc':'🖥️', 'hyrabr':'🌐', 'hyradef':'🛡️', 'notepad':'📝', 'terminal':'⚡', 'calc':'🔢' };
            allIds.forEach(id => {
                const task = document.createElement('div');
                task.className = `taskbar-task${activeWindowId === id ? ' active' : ''}`;
                task.innerHTML = `<span>${icons[id] || '📄'}</span> ${titles[id] || id}`;
                task.onclick = () => {
                    if (minimizedWindows[id]) restoreWindow(id);
                    else if (activeWindowId === id) minimizeWindow(id);
                    else { restoreWindow(id); focusWindow(id); }
                };
                tasks.appendChild(task);
            });
        }

        // ========== ФАЙЛОВАЯ СИСТЕМА ==========
        function generateFile(name, size, date) { return {type:'file', name, size, date}; }
        function createDrive(letter) {
            const root = { type:'folder', children:{} };
            root.children['autoexec.bat'] = generateFile('autoexec.bat','0 KB','01.01.2025');
            root.children['config.sys'] = generateFile('config.sys','0 KB','01.01.2025');
            if (letter === 'C') {
                root.children['Program Files'] = { type:'folder', children: {
                    'Common Files': { type:'folder', children:{} },
                    'Internet Explorer': { type:'folder', children:{ 'iexplore.exe': generateFile('iexplore.exe','1.2 MB','10.06.2025') } }
                }};
                root.children['Windows'] = { type:'folder', children: {
                    'explorer.exe': generateFile('explorer.exe','2.8 MB','01.06.2025'),
                    'System32': { type:'folder', children:{ 'ntoskrnl.exe': generateFile('ntoskrnl.exe','4.5 MB','15.06.2025') } }
                }};
                root.children['hyrosys32'] = { type:'folder', children: {
                    'drivers': { type:'folder', children:{ 'hyrdisk.sys': generateFile('hyrdisk.sys','128 KB','22.06.2025') } }
                }};
                root.children['Users'] = { type:'folder', children:{ 'Hyra': { type:'folder', children:{} } } };
                root.children['Temp'] = { type:'folder', children:{} };
            }
            return root;
        }
        let fileSystem = { 'C': createDrive('C') };
        function getDrive(letter) {
            if (!fileSystem[letter]) fileSystem[letter] = createDrive(letter);
            return fileSystem[letter];
        }
        function resolvePath(letter, path) {
            const drive = getDrive(letter);
            if (!path || path === letter+':\\') return drive;
            const parts = path.replace(letter+':\\','').split('\\').filter(p=>p);
            let cur = drive;
            for (let p of parts) {
                if (cur.children && cur.children[p]) cur = cur.children[p];
                else return null;
            }
            return cur;
        }
        function renderFolderContents(containerId, letter, path) {
            const folder = resolvePath(letter, path);
            if (!folder || folder.type !== 'folder') return '<p>Папка не найдена</p>';
            let html = `<div class="explorer-toolbar"><button class="hyra-btn" onclick="navigateUp('${containerId}')">⬆ Назад</button><span class="explorer-address">${path}</span></div><div style="display:flex; flex-wrap:wrap;">`;
            for (let [name, item] of Object.entries(folder.children)) {
                if (item.type === 'folder') {
                    html += `<div class="desktop-icon" ondblclick="navigateToFolder('${containerId}','${name}')"><div class="icon-img">📁</div><div class="icon-label">${name}</div></div>`;
                } else {
                    html += `<div class="desktop-icon"><div class="icon-img">📄</div><div class="icon-label">${name}<br><small>${item.size}</small></div></div>`;
                }
            }
            html += '</div>';
            return html;
        }
        function navigateToFolder(containerId, name) {
            const body = document.getElementById('body-'+containerId);
            let path = body.getAttribute('data-path') || 'C:\\';
            const letter = containerId.split('-')[1];
            const newPath = path + (path.endsWith('\\')?'':'\\') + name;
            body.innerHTML = renderFolderContents(containerId, letter, newPath);
            body.setAttribute('data-path', newPath);
        }
        function navigateUp(containerId) {
            const body = document.getElementById('body-'+containerId);
            let path = body.getAttribute('data-path') || 'C:\\';
            const letter = containerId.split('-')[1];
            if (path === letter+':\\') return;
            const parts = path.split('\\');
            parts.pop();
            const newPath = parts.join('\\');
            body.innerHTML = renderFolderContents(containerId, letter, newPath);
            body.setAttribute('data-path', newPath);
        }

        // ========== ОТКРЫТИЕ ПРИЛОЖЕНИЙ ==========
        function openApp(appId) {
            if (minimizedWindows[appId]) { restoreWindow(appId); return; }
            if (document.getElementById(`window-${appId}`)) { focusWindow(appId); return; }

            const titles = { 'my-pc':'Этот компьютер', 'hyrabr':'HYRABR', 'hyradef':'HyraDeF Antivirus', 'notepad':'Блокнот', 'terminal':'Терминал', 'calc':'Калькулятор', 'recycle':'Корзина' };
            const icons = { 'my-pc':'🖥️', 'hyrabr':'🌐', 'hyradef':'🛡️', 'notepad':'📝', 'terminal':'⚡', 'calc':'🔢', 'recycle':'🗑️' };
            const width = appId === 'hyrabr' ? 750 : 520;
            const height = appId === 'hyrabr' ? 550 : 400;

            const win = createWindow(appId, titles[appId], icons[appId], width, height);
            const body = document.getElementById('body-'+appId);

            if (appId === 'my-pc') {
                body.innerHTML = `<h2>Устройства и диски</h2><div class="desktop-icon" ondblclick="openDiskC()"><span style="font-size:36px">💾</span>Локальный диск (C:)</div>`;
            } else if (appId === 'recycle') {
                body.innerHTML = '<div style="text-align:center;padding:20px"><span style="font-size:50px">🗑️</span><p>Корзина пуста</p></div>';
            } else if (appId === 'notepad') {
                body.innerHTML = '<textarea class="notepad-textarea">Блокнот HyraIO</textarea>';
            } else if (appId === 'terminal') {
                body.innerHTML = `<div class="terminal-output" id="term-out">C:\\Users\\Hyra>_</div><div class="terminal-input-line"><span class="terminal-prompt">C:\\Users\\Hyra></span><input class="terminal-input" id="term-inp" autofocus></div>`;
                setupTerminal();
            } else if (appId === 'calc') {
                body.innerHTML = `<div style="text-align:center"><h2>Калькулятор</h2><input class="hyra-input" id="calc-display" style="text-align:right; font-size:20px;" readonly>
                <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-top:10px;">
                    ${['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+'].map(sym => `<button class="hyra-btn" onclick="calcInput('${sym}')">${sym}</button>`).join('')}
                    <button class="hyra-btn" onclick="calcClear()">C</button></div></div>`;
                window.calcExpr = '';
            } else if (appId === 'hyrabr') {
                body.innerHTML = `<div style="display:flex; gap:8px; margin-bottom:10px;"><input class="hyra-input" id="hyrabr-search" placeholder="Поиск или введите URL..."><button class="hyra-btn" onclick="doSearch()">🔍</button></div><div id="hyrabr-content" style="flex:1; overflow-y:auto;"></div>`;
                document.getElementById('hyrabr-search').addEventListener('keydown', e => { if (e.key==='Enter') doSearch(); });
                document.getElementById('hyrabr-content').innerHTML = '<p style="color:#888">Добро пожаловать в HYRABR — умный поиск</p>';
            } else if (appId === 'hyradef') {
                body.innerHTML = `<div style="text-align:center"><h2>🛡️ HyraDeF</h2><p id="hyradef-status">Запуск сканирования...</p><div id="hyradef-actions" style="display:none; margin-top:20px;"></div></div>`;
                startHyraDeFScan();
            }

            if (appId.startsWith('disk-')) {
                body.setAttribute('data-path', appId.split('-')[1]+':\\');
            }
            windows[appId] = true;
            focusWindow(appId);
            updateTaskbar();
            if (startMenuOpen) toggleStartMenu();
        }

        function openDiskC() { openApp('disk-C'); let b = document.getElementById('body-disk-C'); b.innerHTML = renderFolderContents('disk-C','C','C:\\'); b.setAttribute('data-path','C:\\'); }

        // ========== ТЕРМИНАЛ ==========
        function setupTerminal() {
            const inp = document.getElementById('term-inp'), out = document.getElementById('term-out');
            inp.addEventListener('keydown', (e) => {
                if (e.key !== 'Enter') return;
                const cmd = inp.value.trim().toLowerCase();
                out.innerHTML += `\nC:\\Users\\Hyra><span style="color:#fff">${inp.value}</span>`;
                if (cmd === 'cls') out.innerHTML = '';
                else if (cmd === 'help') out.innerHTML += '\nДоступные команды: help, cls, ver';
                else out.innerHTML += `\n"${inp.value}" не найдена`;
                out.innerHTML += '\nC:\\Users\\Hyra><span style="color:var(--accent)">_</span>';
                inp.value = '';
                out.scrollTop = out.scrollHeight;
            });
        }

        // ========== КАЛЬКУЛЯТОР ==========
        function calcInput(sym) {
            if (sym === '=') {
                try { window.calcExpr = eval(window.calcExpr).toString(); } catch { window.calcExpr = 'Error'; }
            } else if (sym === 'C') {
                window.calcExpr = '';
            } else {
                window.calcExpr += sym;
            }
            document.getElementById('calc-display').value = window.calcExpr;
        }
        function calcClear() { window.calcExpr = ''; document.getElementById('calc-display').value = ''; }

        // ========== HyraDeF АНТИВИРУС ==========
        function startHyraDeFScan() {
            if (hyradefTimeout) clearTimeout(hyradefTimeout);
            const status = document.getElementById('hyradef-status');
            const actions = document.getElementById('hyradef-actions');
            status.textContent = 'Сканирование... (5 сек)';
            hyradefTimeout = setTimeout(() => {
                if (virusDetected) {
                    status.innerHTML = '<span style="color:red">⚠️ Обнаружена угроза!</span>';
                    actions.style.display = 'block';
                    actions.innerHTML = `<button class="hyra-btn" style="background:var(--success)" onclick="hyradefRemove()">Да, удалить</button>
                                         <button class="hyra-btn" style="background:var(--danger)" onclick="hyradefIgnore()">Нет, оставить</button>`;
                } else {
                    status.innerHTML = '<span style="color:var(--success)">✅ Угроз не обнаружено</span>';
                }
            }, 5000);
        }
        function hyradefRemove() {
            virusDetected = false;
            document.body.classList.remove('virus-bg');
            document.getElementById('virusAlert').style.display = 'none';
            installedAV = 'HyraDeF';
            alert('Вирус удалён! Система защищена.');
            const body = document.getElementById('body-hyradef');
            if (body) body.innerHTML = '<div style="text-align:center"><h2>🛡️ HyraDeF</h2><p style="color:green">Защита активна</p></div>';
        }
        function hyradefIgnore() {
            // BSOD
            document.body.innerHTML = `<div class="bsod"><h1>HYRAIO</h1><p>A problem has been detected and windows has been shut down to prevent damage.</p>
                <p>HYRASYS32.SYS NOT FOUND</p><p style="margin-top:20px">Technical information: *** STOP: 0x0000007B</p>
                <button class="hyra-btn" style="background:white; color:#0000aa; margin-top:30px;" onclick="location.reload()">Перезагрузить</button></div>`;
        }

        // ========== HYRABR ПОИСК ==========
        function doSearch() {
            const q = document.getElementById('hyrabr-search').value.trim().toLowerCase();
            const content = document.getElementById('hyrabr-content');
            if (!q) return;
            if (q.startsWith('погода')) {
                const city = q.replace('погода','').trim() || 'Москва';
                content.innerHTML = `<div class="search-widget"><span style="font-size:24px">${city}</span> +${Math.floor(Math.random()*25)}°C, облачно</div>
                <div class="search-result"><div class="title">Погода в ${city} на сегодня</div><div class="url">weather.com</div><div class="desc">Подробный прогноз...</div></div>`;
            } else if (q.startsWith('время')) {
                const city = q.replace('время','').trim() || 'Лондон';
                content.innerHTML = `<div class="search-widget"><span style="font-size:24px">${city}</span> ${new Date().toLocaleTimeString()}</div>
                <div class="search-result"><div class="title">Текущее время в ${city}</div><div class="url">time.is</div></div>`;
            } else if (q.includes('kaspersky') || q.includes('касперский')) {
                content.innerHTML = `<div class="search-result" onclick="installAV('Kaspersky')"><div class="title">🛡️ Kaspersky Antivirus</div><div class="url">kaspersky.ru</div><div class="desc">Скачать защиту</div></div>`;
            } else if (q.includes('dr.web')) {
                content.innerHTML = `<div class="search-result" onclick="installAV('Dr.Web')"><div class="title">🛡️ Dr.Web</div><div class="url">drweb.ru</div></div>`;
            } else if (q.includes('avast')) {
                content.innerHTML = `<div class="search-result" onclick="installAV('Avast')"><div class="title">🛡️ Avast</div><div class="url">avast.ru</div></div>`;
            } else if (q.includes('eset') || q.includes('нод32')) {
                content.innerHTML = `<div class="search-result" onclick="installAV('ESET')"><div class="title">🛡️ ESET NOD32</div></div>`;
            } else if (q.includes('norton')) {
                content.innerHTML = `<div class="search-result" onclick="installAV('Norton')"><div class="title">🛡️ Norton 360</div></div>`;
            } else if (q.includes('чит') || q.includes('cheat')) {
                if (installedAV) {
                    content.innerHTML = '<p style="color:red">⛔ Антивирус заблокировал загрузку!</p>';
                    return;
                }
                const game = q.replace('читы на','').replace('чит','').trim() || 'игру';
                content.innerHTML = `<div class="search-result" onclick="downloadVirus('${game}')"><div class="title">🎮 Читы для ${game}</div><div class="url">cheats.ru</div><div class="desc" style="color:red">Осторожно: вирус!</div></div>`;
            } else {
                let html = '';
                for (let i=0; i<4; i++) html += `<div class="search-result"><div class="title">Результат ${i+1} для "${q}"</div><div class="url">example${i}.com</div><div class="desc">Описание результата...</div></div>`;
                content.innerHTML = html;
            }
        }

        function installAV(name) {
            installedAV = name;
            virusDetected = false;
            document.body.classList.remove('virus-bg');
            document.getElementById('virusAlert').style.display = 'none';
            alert(`${name} установлен!`);
            const c = document.getElementById('hyrabr-content'); if (c) c.innerHTML += '<p style="color:green">Защита активна.</p>';
        }

        function downloadVirus(game) {
            if (installedAV) { alert(`⛔ ${installedAV} заблокировал!`); return; }
            virusDetected = true;
            document.body.classList.add('virus-bg');
            document.getElementById('virusAlert').style.display = 'block';
            alert(`☠️ Вирус Trojan.${game.replace(/\s/g,'')} активирован!`);
            const c = document.getElementById('hyrabr-content'); if (c) c.innerHTML += '<p style="color:red">Система заражена!</p>';
        }

        function shutdown() {
            document.body.innerHTML = '<div style="display:flex; align-items:center; justify-content:center; height:100vh; background:#000; color:#fff"><h1>Завершение работы...</h1></div>';
            setTimeout(() => location.reload(), 2000);
        }

        // ========== СОХРАНЕНИЕ / ВОССТАНОВЛЕНИЕ ==========
        function saveState() {
            const state = { virusDetected, installedAV, extraDrives };
            localStorage.setItem('hyraio-state', JSON.stringify(state));
        }
        function loadState() {
            const saved = localStorage.getItem('hyraio-state');
            if (saved) {
                try {
                    const s = JSON.parse(saved);
                    virusDetected = s.virusDetected || false;
                    installedAV = s.installedAV || null;
                    extraDrives = s.extraDrives || [];
                    if (virusDetected) { document.body.classList.add('virus-bg'); document.getElementById('virusAlert').style.display = 'block'; }
                } catch(e){}
            }
        }
        window.addEventListener('beforeunload', saveState);
        loadState();

        document.addEventListener('keydown', e => { if (e.key==='Escape' && activeWindowId) minimizeWindow(activeWindowId); });
        console.log('HyraIO OS v2.0 — 1300+ строк, полный фарш!');
    </script>
</body>
</html>
