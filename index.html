<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HyraIO</title>
    <style>
        :root {
            --bg: #0a0a1a;
            --taskbar: rgba(10, 15, 30, 0.85);
            --taskbar-border: rgba(255, 255, 255, 0.08);
            --window-bg: rgba(15, 20, 40, 0.95);
            --window-header: rgba(20, 30, 60, 0.95);
            --text: #d0d8f0;
            --accent: #4da8ff;
            --accent-glow: rgba(77, 168, 255, 0.4);
            --danger: #ff5c5c;
            --success: #4dff91;
            --warning: #ffb84d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: #050510;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            display: flex;
            flex-direction: column;
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(20, 80, 200, 0.25) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 60%, rgba(15, 50, 150, 0.3) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(10, 30, 100, 0.2) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 80%, rgba(30, 100, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 10% 90%, rgba(0, 60, 180, 0.2) 0%, transparent 50%),
                linear-gradient(180deg, #050510 0%, #080e25 30%, #0a1030 60%, #060d20 100%);
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.003) 2px, rgba(255,255,255,0.003) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,0.003) 2px, rgba(255,255,255,0.003) 4px);
            pointer-events: none;
            z-index: 0;
        }

        #watermark {
            position: fixed;
            bottom: 50px;
            right: 30px;
            color: rgba(255, 255, 255, 0.05);
            font-size: 80px;
            font-weight: 900;
            letter-spacing: 4px;
            z-index: 0;
            pointer-events: none;
            text-transform: uppercase;
        }

        #desktop {
            flex: 1;
            position: relative;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 1;
        }

        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 8px 6px;
            width: 80px;
            text-align: center;
            color: #e0e8ff;
            font-size: 11px;
            gap: 4px;
            border-radius: 8px;
            transition: all 0.15s;
            position: relative;
            z-index: 1;
        }
        .desktop-icon:hover { background: rgba(77, 168, 255, 0.12); backdrop-filter: blur(8px); }
        .desktop-icon:active { background: rgba(77, 168, 255, 0.2); }
        .desktop-icon .icon-img {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            transition: transform 0.15s;
        }
        .desktop-icon:hover .icon-img { transform: scale(1.08); }
        .desktop-icon .icon-label {
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            line-height: 1.3;
            word-wrap: break-word;
            max-width: 75px;
        }

        .window {
            position: absolute;
            background: var(--window-bg);
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            min-width: 300px;
            min-height: 200px;
            z-index: 10;
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: windowOpen 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes windowOpen {
            from { opacity: 0; transform: scale(0.92) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .window.focused {
            z-index: 100;
            box-shadow: 0 25px 70px rgba(0,0,0,0.7), 0 0 0 1.5px var(--accent-glow), 0 0 20px rgba(77,168,255,0.1);
        }
        .window-header {
            background: var(--window-header);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: default;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            min-height: 38px;
        }
        .window-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
            color: #c0d0f0;
        }
        .window-controls { display: flex; gap: 6px; }
        .win-btn {
            width: 28px; height: 28px;
            border-radius: 6px; border: none;
            cursor: pointer;
            font-size: 11px;
            display: flex; align-items: center; justify-content: center;
            color: #c0d0f0;
            background: rgba(255,255,255,0.04);
            transition: all 0.15s;
        }
        .win-btn:hover { background: rgba(255,255,255,0.1); }
        .win-btn.close:hover { background: var(--danger); color: #fff; }
        .win-btn.minimize:hover { background: var(--warning); color: #000; }
        .win-btn.maximize:hover { background: var(--success); color: #000; }

        .window-body {
            flex: 1;
            padding: 14px;
            overflow: auto;
            font-size: 13px;
            color: #c0d0f0;
            line-height: 1.5;
        }

        #taskbar {
            background: var(--taskbar);
            height: 44px;
            display: flex;
            align-items: center;
            padding: 0 6px;
            gap: 4px;
            z-index: 200;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid var(--taskbar-border);
        }
        #start-btn {
            background: rgba(77,168,255,0.15);
            border: 1px solid rgba(77,168,255,0.2);
            color: #e0e8ff;
            font-weight: 600;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            height: 32px; white-space: nowrap;
        }
        #start-btn:hover { background: rgba(77,168,255,0.25); }

        #quick-launch {
            display: flex; gap: 2px; align-items: center;
            height: 34px; padding: 0 4px;
            border-right: 1px solid rgba(255,255,255,0.08);
            margin-right: 4px;
        }
        .quick-launch-icon {
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; border-radius: 6px;
            cursor: pointer; background: transparent;
        }
        .quick-launch-icon:hover { background: rgba(255,255,255,0.08); }

        #taskbar-tasks {
            display: flex; gap: 3px; flex: 1;
            overflow-x: auto; height: 34px; align-items: center;
        }
        .taskbar-task {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: #c0d0f0;
            padding: 5px 14px; border-radius: 6px;
            cursor: pointer; font-size: 11px;
            white-space: nowrap; max-width: 160px;
            overflow: hidden; text-overflow: ellipsis;
            height: 30px; display: flex; align-items: center; gap: 6px;
        }
        .taskbar-task.active {
            background: rgba(77,168,255,0.2);
            border-color: rgba(77,168,255,0.4);
            color: #fff; font-weight: 500;
        }

        #tray {
            display: flex; align-items: center; gap: 10px;
            padding: 0 10px; height: 30px;
            font-size: 11px; color: #b0c0e0; white-space: nowrap;
        }

        #start-menu {
            position: absolute; bottom: 50px; left: 6px;
            background: rgba(15,20,40,0.95);
            backdrop-filter: blur(30px);
            border-radius: 12px; padding: 8px;
            display: none; min-width: 220px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 300;
        }
        #start-menu.show { display: block; }
        .start-menu-item {
            padding: 9px 14px; border-radius: 8px;
            cursor: pointer; display: flex; align-items: center; gap: 10px;
            font-size: 12px; color: #c0d0f0;
        }
        .start-menu-item:hover { background: rgba(77,168,255,0.15); color: #fff; }

        .hyra-btn {
            background: rgba(77,168,255,0.15);
            border: 1px solid rgba(77,168,255,0.25);
            color: #d0e0ff; padding: 7px 18px;
            border-radius: 6px; cursor: pointer;
            font-size: 12px; font-family: inherit;
        }
        .hyra-btn:hover { background: rgba(77,168,255,0.25); }

        .notepad-textarea {
            width: 100%; height: 100%; min-height: 180px;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px; color: #d0d8f0;
            padding: 10px; font-family: 'Consolas', monospace;
            font-size: 13px; resize: none; outline: none;
        }

        .terminal-output {
            background: rgba(0,0,0,0.4); color: #b0d0ff;
            font-family: 'Consolas', monospace; font-size: 13px;
            padding: 10px; height: calc(100% - 38px);
            overflow-y: auto; white-space: pre-wrap;
            border-radius: 6px 6px 0 0;
            border: 1px solid rgba(255,255,255,0.06); border-bottom: none;
        }
        .terminal-input-line {
            display: flex; background: rgba(0,0,0,0.4);
            padding: 6px 10px; border-radius: 0 0 6px 6px;
            border: 1px solid rgba(255,255,255,0.06); border-top: none;
            align-items: center; cursor: text;
        }
        .terminal-prompt {
            color: var(--accent); font-family: 'Consolas', monospace;
            font-size: 13px; margin-right: 6px; white-space: nowrap;
        }
        .terminal-input {
            background: transparent; border: none;
            color: #e0e8ff; font-family: 'Consolas', monospace;
            font-size: 13px; outline: none; flex: 1;
            caret-color: var(--accent);
        }

        /* Иконки в проводнике */
        .drive-icon, .folder-icon {
            display: flex; flex-direction: column; align-items: center;
            width: 90px; padding: 12px 8px; cursor: pointer;
            border-radius: 8px; text-align: center;
            transition: background 0.15s; color: #c0d0f0;
        }
        .drive-icon:hover, .folder-icon:hover { background: rgba(255,255,255,0.06); }
        .drive-icon .icon, .folder-icon .icon {
            font-size: 36px; margin-bottom: 4px;
        }
        .drive-icon .label, .folder-icon .label {
            font-size: 11px; word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div id="watermark">HyraIO</div>

    <div id="desktop">
        <div class="desktop-icon" data-app="my-pc" ondblclick="openApp('my-pc')">
            <div class="icon-img">🖥️</div>
            <div class="icon-label">Этот компьютер</div>
        </div>
        <div class="desktop-icon" data-app="recycle" ondblclick="openApp('recycle')">
            <div class="icon-img">🗑️</div>
            <div class="icon-label">Корзина</div>
        </div>
        <div class="desktop-icon" data-app="notepad" ondblclick="openApp('notepad')">
            <div class="icon-img">📝</div>
            <div class="icon-label">Блокнот</div>
        </div>
        <div class="desktop-icon" data-app="terminal" ondblclick="openApp('terminal')">
            <div class="icon-img">⚡</div>
            <div class="icon-label">Терминал</div>
        </div>
    </div>

    <div id="start-menu">
        <div class="start-menu-item" onclick="openApp('my-pc'); toggleStartMenu()"><span>🖥️</span> Этот компьютер</div>
        <div class="start-menu-item" onclick="openApp('notepad'); toggleStartMenu()"><span>📝</span> Блокнот</div>
        <div class="start-menu-item" onclick="openApp('terminal'); toggleStartMenu()"><span>⚡</span> Терминал</div>
        <div class="start-menu-separator"></div>
        <div class="start-menu-item" onclick="shutdown()"><span>⏻</span> Завершение работы</div>
        <div class="start-menu-footer">HyraIO v1.0</div>
    </div>

    <div id="taskbar">
        <button id="start-btn" onclick="toggleStartMenu()"><span>⊞</span> Пуск</button>
        <div id="quick-launch">
            <div class="quick-launch-icon" title="Этот компьютер" onclick="openApp('my-pc')">🖥️</div>
            <div class="quick-launch-icon" title="Блокнот" onclick="openApp('notepad')">📝</div>
            <div class="quick-launch-icon" title="Терминал" onclick="openApp('terminal')">⚡</div>
        </div>
        <div id="taskbar-tasks"></div>
        <div id="tray">
            <span id="clock">00:00</span>
            <span id="date-display"></span>
        </div>
    </div>

    <script>
        // ==================== HyraIO OS ====================
        let windows = {};
        let windowZIndex = 10;
        let activeWindowId = null;
        let windowCount = 0;
        let startMenuOpen = false;
        let minimizedWindows = {};

        // Дополнительные диски (буквы)
        let extraDrives = []; // ['D', 'E', ...]

        // ===== CLOCK =====
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent =
                `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            document.getElementById('date-display').textContent =
                now.toLocaleDateString('ru-RU', { day:'numeric', month:'short', year:'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ===== START MENU =====
        function toggleStartMenu() {
            startMenuOpen = !startMenuOpen;
            document.getElementById('start-menu').classList.toggle('show', startMenuOpen);
        }
        document.addEventListener('click', (e) => {
            if (!startMenuOpen) return;
            const menu = document.getElementById('start-menu');
            const btn = document.getElementById('start-btn');
            if (!menu.contains(e.target) && e.target !== btn) {
                startMenuOpen = false;
                menu.classList.remove('show');
            }
        });

        // ===== WINDOW MANAGEMENT =====
        function createWindowElement(id, title, icon='📄') {
            const win = document.createElement('div');
            win.className = 'window';
            win.id = `window-${id}`;
            win.style.left = `${50 + (windowCount*30)%350}px`;
            win.style.top  = `${50 + (windowCount*30)%250}px`;
            win.style.width = id.startsWith('disk-') ? '600px' : '520px';
            win.style.height = '420px';
            win.style.zIndex = ++windowZIndex;
            win.innerHTML = `
                <div class="window-header" data-window-id="${id}">
                    <span class="window-title"><span class="win-icon">${icon}</span> ${title}</span>
                    <div class="window-controls">
                        <button class="win-btn minimize" data-action="minimize">─</button>
                        <button class="win-btn maximize" data-action="maximize">□</button>
                        <button class="win-btn close" data-action="close">✕</button>
                    </div>
                </div>
                <div class="window-body" id="body-${id}"></div>
            `;
            document.body.appendChild(win);
            windowCount++;

            win.querySelectorAll('.win-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const action = btn.dataset.action;
                    if (action === 'close') closeWindow(id);
                    if (action === 'minimize') minimizeWindow(id);
                    if (action === 'maximize') maximizeWindow(id);
                });
            });
            win.addEventListener('mousedown', () => focusWindow(id));

            // Drag
            const header = win.querySelector('.window-header');
            let isDragging = false, ox, oy;
            header.addEventListener('mousedown', (e) => {
                if (e.target.closest('.win-btn')) return;
                isDragging = true;
                const r = win.getBoundingClientRect();
                ox = e.clientX - r.left;
                oy = e.clientY - r.top;
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                win.style.left = `${e.clientX - ox}px`;
                win.style.top  = `${e.clientY - oy}px`;
            });
            document.addEventListener('mouseup', () => { isDragging = false; });

            header.addEventListener('touchstart', (e) => {
                if (e.target.closest('.win-btn')) return;
                isDragging = true;
                const r = win.getBoundingClientRect();
                ox = e.touches[0].clientX - r.left;
                oy = e.touches[0].clientY - r.top;
            }, {passive: false});
            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                win.style.left = `${e.touches[0].clientX - ox}px`;
                win.style.top  = `${e.touches[0].clientY - oy}px`;
            }, {passive: false});
            document.addEventListener('touchend', () => { isDragging = false; });

            return win;
        }

        function focusWindow(id) {
            if (activeWindowId === id) return;
            activeWindowId = id;
            document.querySelectorAll('.window').forEach(w => w.classList.remove('focused'));
            const win = document.getElementById(`window-${id}`);
            if (win) {
                win.classList.add('focused');
                win.style.zIndex = ++windowZIndex;
            }
            updateTaskbar();
        }

        function closeWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if (win) {
                win.remove();
                windowCount--;
                delete windows[id];
                delete minimizedWindows[id];
                if (activeWindowId === id) activeWindowId = null;
                updateTaskbar();
            }
        }

        function minimizeWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if (win) {
                win.style.display = 'none';
                minimizedWindows[id] = true;
                if (activeWindowId === id) activeWindowId = null;
                updateTaskbar();
            }
        }

        function maximizeWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if (!win) return;
            if (win.style.width === '100%') {
                win.style.width = id.startsWith('disk-') ? '600px' : '520px';
                win.style.height = '420px';
                win.style.left = '50px';
                win.style.top = '50px';
                win.style.borderRadius = '10px';
            } else {
                win.style.width = '100%';
                win.style.height = 'calc(100% - 44px)';
                win.style.left = '0';
                win.style.top = '0';
                win.style.borderRadius = '0';
            }
        }

        function restoreWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if (win && win.style.display === 'none') {
                win.style.display = 'flex';
                delete minimizedWindows[id];
                focusWindow(id);
                updateTaskbar();
            }
        }

        function updateTaskbar() {
            const container = document.getElementById('taskbar-tasks');
            container.innerHTML = '';

            const allIds = new Set();
            document.querySelectorAll('.window').forEach(w => allIds.add(w.id.replace('window-','')));
            Object.keys(minimizedWindows).forEach(id => allIds.add(id));

            const titles = {
                'my-pc':'Этот компьютер', 'recycle':'Корзина', 'notepad':'Блокнот', 'terminal':'Терминал'
            };
            const icons = {
                'my-pc':'🖥️', 'recycle':'🗑️', 'notepad':'📝', 'terminal':'⚡'
            };

            allIds.forEach(id => {
                let title = titles[id] || '';
                let icon = icons[id] || '📄';
                if (id.startsWith('disk-')) {
                    icon = '💾';
                    const letter = id.split('-')[1];
                    title = `Локальный диск (${letter}:)`;
                }

                const isMinimized = !!minimizedWindows[id];
                const isActive = (activeWindowId === id && !isMinimized);

                const task = document.createElement('div');
                task.className = `taskbar-task${isActive ? ' active' : ''}`;
                task.innerHTML = `<span class="task-icon">${icon}</span> ${title.substring(0,16)}`;
                task.onclick = () => {
                    if (isMinimized) restoreWindow(id);
                    else if (isActive) minimizeWindow(id);
                    else { restoreWindow(id); focusWindow(id); }
                };
                container.appendChild(task);
            });
        }

        // ===== ПОЛУЧЕНИЕ КОНТЕНТА ДЛЯ ОКОН =====
        function getAppContent(appId) {
            // Окно проводника диска
            if (appId.startsWith('disk-')) {
                const letter = appId.split('-')[1];
                const folders = [
                    { name: 'Program Files', icon: '📁' },
                    { name: 'Windows', icon: '📁' },
                    { name: 'Users', icon: '📁' },
                    { name: 'hyrosys32', icon: '📁' },
                    { name: 'Temp', icon: '📁' },
                    { name: 'Documents and Settings', icon: '📁' },
                    { name: 'PerfLogs', icon: '📁' },
                    { name: 'Recovery', icon: '📁' }
                ];
                if (letter === 'C') {
                    // Добавим ещё парочку типичных папок
                    folders.push({ name: 'inetpub', icon: '📁' });
                    folders.push({ name: 'MSOCache', icon: '📁' });
                }
                let html = `<div style="display:flex; flex-wrap:wrap; gap:12px; padding:8px;">`;
                folders.forEach(f => {
                    html += `
                        <div class="folder-icon" ondblclick="openFolder('${f.name}')">
                            <div class="icon">${f.icon}</div>
                            <div class="label">${f.name}</div>
                        </div>`;
                });
                html += `</div>`;
                return html;
            }

            switch(appId) {
                case 'my-pc':
                    return renderMyPcContent();
                case 'recycle':
                    return `<div style="text-align:center;padding:20px;"><p style="font-size:52px;">🗑️</p><p>Корзина</p><p style="color:#6070a0;">Корзина пуста</p><button class="hyra-btn" style="margin-top:16px;">Очистить корзину</button></div>`;
                case 'notepad':
                    return `<textarea class="notepad-textarea" placeholder="Безымянный — Блокнот">Блокнот HyraIO\nГотов к работе…</textarea>`;
                case 'terminal':
                    return `
                        <div style="display:flex; flex-direction:column; height:100%;" id="term-container-${appId}">
                            <div class="terminal-output" id="term-output-${appId}">
⚡ HyraIO Terminal v1.0
─────────────────────────────
Введите 'help' для списка команд.

C:\\Users\\Hyra><span style="color:var(--accent);">_</span>
                            </div>
                            <div class="terminal-input-line" id="term-input-line-${appId}">
                                <span class="terminal-prompt">C:\\Users\\Hyra></span>
                                <input type="text" class="terminal-input" id="term-input-${appId}" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
                            </div>
                        </div>`;
                default: return '<p>Приложение не найдено</p>';
            }
        }

        function renderMyPcContent() {
            let drivesHtml = `
                <div class="drive-icon" ondblclick="openApp('disk-C')">
                    <div class="icon">💾</div>
                    <div class="label">Локальный диск (C:)<br>HYRIAC</div>
                </div>`;

            // Дополнительные добавленные диски
            extraDrives.forEach(letter => {
                drivesHtml += `
                <div class="drive-icon" ondblclick="openApp('disk-${letter}')">
                    <div class="icon">💾</div>
                    <div class="label">Локальный диск (${letter}:)<br>Новый том</div>
                </div>`;
            });

            return `
                <div style="padding:8px;">
                    <p style="font-size:14px; font-weight:600; margin-bottom:12px;">Устройства и диски</p>
                    <div style="display:flex; flex-wrap:wrap; gap:16px; margin-bottom:16px;">
                        ${drivesHtml}
                    </div>
                    <button class="hyra-btn" onclick="addNewDrive()">➕ Добавить диск</button>
                </div>`;
        }

        // ===== ДОБАВЛЕНИЕ НОВОГО ДИСКА =====
        function addNewDrive() {
            // Берём следующую букву после C и уже добавленных
            const used = ['C', ...extraDrives];
            const nextLetter = 'DEFGHIJKLMNOPQRSTUVWXYZ'.split('').find(l => !used.includes(l)) || 'Z';
            extraDrives.push(nextLetter);
            // Обновляем окно "Мой компьютер", если открыто
            const pcWin = document.getElementById('window-my-pc');
            if (pcWin && pcWin.style.display !== 'none') {
                const body = pcWin.querySelector('.window-body');
                if (body) body.innerHTML = renderMyPcContent();
            }
        }

        // ===== ОТКРЫТИЕ ПАПКИ (заглушка) =====
        function openFolder(name) {
            const id = 'folder-' + name.replace(/\s/g, '-');
            // Проверяем, нет ли уже окна
            if (windows[id]) {
                const win = document.getElementById(`window-${id}`);
                if (win && win.style.display !== 'none') { focusWindow(id); return; }
                if (minimizedWindows[id]) { restoreWindow(id); return; }
            }
            const win = createWindowElement(id, name, '📁');
            win.querySelector('.window-body').innerHTML = `<div style="text-align:center; padding:30px; color:#6070a0;">Папка "${name}" пуста.</div>`;
            windows[id] = true;
            focusWindow(id);
            updateTaskbar();
        }

        // ===== ОТКРЫТИЕ ПРИЛОЖЕНИЙ =====
        function openApp(appId) {
            // Обработка свёрнутых
            if (minimizedWindows[appId]) { restoreWindow(appId); return; }
            if (windows[appId]) {
                const win = document.getElementById(`window-${appId}`);
                if (win && win.style.display !== 'none') {
                    focusWindow(appId);
                    return;
                }
            }

            const titles = {
                'my-pc':'Этот компьютер', 'recycle':'Корзина', 'notepad':'Блокнот', 'terminal':'Терминал'
            };
            const icons = {
                'my-pc':'🖥️', 'recycle':'🗑️', 'notepad':'📝', 'terminal':'⚡'
            };

            let title, icon;
            if (appId.startsWith('disk-')) {
                const letter = appId.split('-')[1];
                title = `Локальный диск (${letter}:)`;
                icon = '💾';
            } else {
                title = titles[appId] || appId;
                icon = icons[appId] || '📄';
            }

            const win = createWindowElement(appId, title, icon);
            win.querySelector('.window-body').innerHTML = getAppContent(appId);
            windows[appId] = true;
            delete minimizedWindows[appId];
            focusWindow(appId);
            updateTaskbar();

            if (appId === 'terminal') setupTerminal(appId);
            if (startMenuOpen) toggleStartMenu();
        }

        // ===== ТЕРМИНАЛ =====
        function setupTerminal(appId) {
            const input  = document.getElementById(`term-input-${appId}`);
            const output = document.getElementById(`term-output-${appId}`);
            const line   = document.getElementById(`term-input-line-${appId}`);
            if (!input || !output) return;
            const focusInput = () => { input.focus(); };
            line.addEventListener('click', focusInput);
            output.addEventListener('click', focusInput);
            const commands = {
                help: `Доступные команды:\n  HELP  - справка\n  DIR   - список файлов\n  CLS   - очистить\n  VER   - версия\n  DATE  - дата\n  TIME  - время\n  EXIT  - закрыть`,
                dir: ` Том в устройстве C: HYRIAC\n Серийный номер: HRA1-IO25\n\n Содержимое C:\\\n\n hyrosys32   <DIR>\n Program Files <DIR>\n Windows     <DIR>\n Users       <DIR>\n autoexec.bat 0\n config.sys   0`,
                ver: `HyraIO OS Версия 1.0.0`,
                date: new Date().toLocaleDateString('ru-RU', { weekday:'long', year:'numeric', month:'long', day:'numeric' }),
                time: new Date().toLocaleTimeString('ru-RU'),
            };
            input.addEventListener('keydown', (e) => {
                if (e.key !== 'Enter') return;
                const cmd = input.value.trim().toLowerCase();
                output.innerHTML += `\nC:\\Users\\Hyra><span style="color:#fff;">${input.value}</span>`;
                if (cmd === 'cls') output.innerHTML = '';
                else if (cmd === 'exit') closeWindow(appId);
                else if (commands[cmd]) output.innerHTML += `\n${commands[cmd]}`;
                else if (cmd !== '') output.innerHTML += `\n"${input.value}" не является командой.`;
                output.innerHTML += '\n\nC:\\Users\\Hyra><span style="color:var(--accent);">_</span>';
                output.scrollTop = output.scrollHeight;
                input.value = '';
                input.focus();
            });
            setTimeout(() => input.focus(), 100);
        }

        function shutdown() {
            document.body.innerHTML = `
                <div style="background:#050510; display:flex; align-items:center; justify-content:center; height:100vh; flex-direction:column; color:#e0e8ff;
                    background-image: radial-gradient(ellipse at 50% 50%, rgba(20,80,200,0.2) 0%, transparent 70%);">
                    <div style="background:rgba(15,20,40,0.9); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.06); border-radius:16px; padding:40px; text-align:center;">
                        <p style="font-size:48px;">⏻</p>
                        <p style="font-weight:600;">Завершение работы HyraIO</p>
                        <button class="hyra-btn" style="margin-top:20px;" onclick="location.reload()">Перезапустить</button>
                    </div>
                </div>`;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && activeWindowId) minimizeWindow(activeWindowId);
        });

        console.log('HyraIO OS v1.0 — твой компьютер с HYRIAC');
    </script>
</body>
</html>
