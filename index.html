<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Web</title>
    <style>
        :root {
            --bg: #008080;
            --taskbar: #c0c0c0;
            --taskbar-border: #dfdfdf;
            --window-bg: #c0c0c0;
            --window-header: #000080;
            --window-header-text: #ffffff;
            --text: #000000;
            --btn-face: #c0c0c0;
            --btn-highlight: #ffffff;
            --btn-shadow: #808080;
            --btn-dark-shadow: #404040;
            --desktop-bg: #008080;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'MS Sans Serif', 'Segoe UI', 'Tahoma', sans-serif;
            background: var(--desktop-bg);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            display: flex;
            flex-direction: column;
            font-size: 12px;
            image-rendering: pixelated;
        }

        /* ===== DESKTOP ===== */
        #desktop {
            flex: 1;
            position: relative;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 1;
        }

        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 4px;
            width: 75px;
            text-align: center;
            color: #fff;
            font-size: 11px;
            gap: 2px;
        }
        .desktop-icon .icon-img {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.5));
        }
        .desktop-icon .icon-label {
            text-shadow: 1px 1px 1px rgba(0,0,0,0.8);
            line-height: 1.2;
            word-wrap: break-word;
        }
        .desktop-icon.selected {
            background: rgba(0,0,128,0.6);
            outline: 1px dotted #ffff00;
        }

        /* ===== WINDOWS (Classic Win95 style) ===== */
        .window {
            position: absolute;
            background: var(--window-bg);
            box-shadow: inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf, inset -2px -2px 0 #808080, inset 2px 2px 0 #ffffff;
            display: flex;
            flex-direction: column;
            min-width: 280px;
            min-height: 180px;
            z-index: 10;
            padding: 2px;
        }

        .window.focused {
            z-index: 100;
        }

        .window-header {
            background: linear-gradient(90deg, #000080, #1084d0);
            padding: 2px 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: default;
            color: #ffffff;
            font-weight: bold;
            font-size: 12px;
            height: 22px;
        }
        .window-title {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
        }
        .window-title .win-icon {
            width: 16px;
            height: 16px;
            font-size: 12px;
        }
        .window-controls {
            display: flex;
            gap: 2px;
        }
        .win-btn {
            width: 16px;
            height: 14px;
            background: var(--btn-face);
            border: none;
            cursor: pointer;
            box-shadow: inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf, inset -2px -2px 0 #808080, inset 2px 2px 0 #ffffff;
            font-size: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
            padding: 0;
        }
        .win-btn:active {
            box-shadow: inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf, inset 2px 2px 0 #808080, inset -2px -2px 0 #ffffff;
        }

        .window-body {
            flex: 1;
            background: #ffffff;
            box-shadow: inset -1px -1px 0 #dfdfdf, inset 1px 1px 0 #808080, inset -2px -2px 0 #ffffff, inset 2px 2px 0 #404040;
            margin: 0;
            padding: 8px;
            overflow: auto;
            font-size: 12px;
            color: #000;
        }

        /* ===== TASKBAR ===== */
        #taskbar {
            background: var(--taskbar);
            height: 28px;
            display: flex;
            align-items: center;
            padding: 2px 2px;
            gap: 3px;
            box-shadow: inset 0 1px 0 #dfdfdf, inset 0 2px 0 #ffffff;
            z-index: 200;
            border-top: 1px solid #ffffff;
        }
        #start-btn {
            background: var(--btn-face);
            border: none;
            color: #000;
            font-weight: bold;
            font-size: 11px;
            padding: 2px 6px;
            cursor: pointer;
            box-shadow: inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf, inset -2px -2px 0 #808080, inset 2px 2px 0 #ffffff;
            display: flex;
            align-items: center;
            gap: 3px;
            height: 22px;
            white-space: nowrap;
        }
        #start-btn:active {
            box-shadow: inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf, inset 2px 2px 0 #808080, inset -2px -2px 0 #ffffff;
            padding: 3px 5px 1px 7px;
        }
        #taskbar-tasks {
            display: flex;
            gap: 2px;
            flex: 1;
            overflow-x: auto;
            height: 22px;
        }
        .taskbar-task {
            background: var(--btn-face);
            box-shadow: inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf, inset -2px -2px 0 #808080, inset 2px 2px 0 #ffffff;
            color: #000;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 11px;
            white-space: nowrap;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 22px;
            display: flex;
            align-items: center;
        }
        .taskbar-task.active {
            box-shadow: inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf, inset 2px 2px 0 #808080, inset -2px -2px 0 #ffffff;
            font-weight: bold;
            background: #d4d0c8;
        }
        #tray {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 8px;
            height: 22px;
            box-shadow: inset -1px -1px 0 #ffffff, inset 1px 1px 0 #808080, inset -2px -2px 0 #dfdfdf, inset 2px 2px 0 #404040;
            font-size: 11px;
            white-space: nowrap;
        }

        /* ===== START MENU ===== */
        #start-menu {
            position: absolute;
            bottom: 30px;
            left: 0;
            background: var(--btn-face);
            box-shadow: inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf, inset -2px -2px 0 #808080, inset 2px 2px 0 #ffffff;
            padding: 2px;
            display: none;
            min-width: 180px;
            z-index: 300;
        }
        #start-menu.show {
            display: block;
        }
        .start-menu-item {
            padding: 6px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #000;
        }
        .start-menu-item:hover {
            background: #000080;
            color: #ffffff;
        }
        .start-menu-item .smi-icon {
            width: 20px;
            text-align: center;
            font-size: 14px;
        }
        .start-menu-separator {
            height: 1px;
            background: #808080;
            margin: 2px 4px;
            box-shadow: 0 1px 0 #ffffff;
        }

        /* ===== BUTTONS ===== */
        .win95-btn {
            background: var(--btn-face);
            border: none;
            padding: 4px 16px;
            font-size: 12px;
            cursor: pointer;
            box-shadow: inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf, inset -2px -2px 0 #808080, inset 2px 2px 0 #ffffff;
            font-family: inherit;
        }
        .win95-btn:active {
            box-shadow: inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf, inset 2px 2px 0 #808080, inset -2px -2px 0 #ffffff;
        }

        /* ===== INPUT ===== */
        .win95-input {
            background: #ffffff;
            border: none;
            box-shadow: inset -1px -1px 0 #dfdfdf, inset 1px 1px 0 #808080, inset -2px -2px 0 #ffffff, inset 2px 2px 0 #404040;
            padding: 3px 6px;
            font-size: 12px;
            font-family: inherit;
            outline: none;
        }

        /* ===== NOTEPAD ===== */
        .notepad-textarea {
            width: 100%;
            height: 100%;
            min-height: 180px;
            border: none;
            box-shadow: inset -1px -1px 0 #dfdfdf, inset 1px 1px 0 #808080, inset -2px -2px 0 #ffffff, inset 2px 2px 0 #404040;
            padding: 4px;
            font-family: 'Fixedsys', 'Courier New', monospace;
            font-size: 13px;
            resize: none;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Desktop -->
    <div id="desktop">
        <div class="desktop-icon" data-app="my-pc" ondblclick="openApp('my-pc')">
            <div class="icon-img">🖥️</div>
            <div class="icon-label">Мой компьютер</div>
        </div>
        <div class="desktop-icon" data-app="recycle" ondblclick="openApp('recycle')">
            <div class="icon-img">🗑️</div>
            <div class="icon-label">Корзина</div>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu">
        <div class="start-menu-item" onclick="openApp('my-pc'); toggleStartMenu()">
            <span class="smi-icon">🖥️</span> Мой компьютер
        </div>
        <div class="start-menu-item" onclick="openApp('notepad'); toggleStartMenu()">
            <span class="smi-icon">📝</span> Блокнот
        </div>
        <div class="start-menu-item" onclick="openApp('terminal'); toggleStartMenu()">
            <span class="smi-icon">>_</span> Командная строка
        </div>
        <div class="start-menu-separator"></div>
        <div class="start-menu-item" onclick="shutdown()">
            <span class="smi-icon">⏻</span> Завершение работы...
        </div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <button id="start-btn" onclick="toggleStartMenu()">
            <span style="font-size:14px;">⊞</span> Пуск
        </button>
        <div id="taskbar-tasks"></div>
        <div id="tray">
            <span id="clock">00:00</span>
        </div>
    </div>

    <script>
        // ==================== WINDOWS WEB OS ====================

        let windows = {};
        let windowZIndex = 10;
        let activeWindowId = null;
        let windowCount = 0;
        let startMenuOpen = false;

        // ===== CLOCK =====
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h}:${m}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ===== START MENU =====
        function toggleStartMenu() {
            startMenuOpen = !startMenuOpen;
            const menu = document.getElementById('start-menu');
            if (startMenuOpen) {
                menu.classList.add('show');
            } else {
                menu.classList.remove('show');
            }
        }

        document.addEventListener('click', function(e) {
            const menu = document.getElementById('start-menu');
            const startBtn = document.getElementById('start-btn');
            if (startMenuOpen && !menu.contains(e.target) && e.target !== startBtn) {
                startMenuOpen = false;
                menu.classList.remove('show');
            }
        });

        // ===== WINDOW MANAGEMENT =====
        function createWindowElement(id, title, icon = '📄') {
            const win = document.createElement('div');
            win.className = 'window';
            win.id = `window-${id}`;
            win.style.left = `${40 + (windowCount * 25) % 300}px`;
            win.style.top = `${40 + (windowCount * 25) % 200}px`;
            win.style.width = '500px';
            win.style.height = '380px';
            win.style.zIndex = ++windowZIndex;
            win.innerHTML = `
            <div class="window-header" data-window-id="${id}">
              <span class="window-title"><span class="win-icon">${icon}</span> ${title}</span>
              <div class="window-controls">
                <button class="win-btn" data-action="minimize" title="Свернуть">─</button>
                <button class="win-btn" data-action="maximize" title="Развернуть">□</button>
                <button class="win-btn" data-action="close" title="Закрыть">✕</button>
              </div>
            </div>
            <div class="window-body" id="body-${id}"></div>
          `;
            document.body.appendChild(win);
            windowCount++;

            win.querySelectorAll('.win-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const action = this.dataset.action;
                    if (action === 'close') closeWindow(id);
                    if (action === 'minimize') minimizeWindow(id);
                    if (action === 'maximize') maximizeWindow(id);
                });
            });

            win.addEventListener('mousedown', function() {
                focusWindow(id);
            });

            // Dragging
            const header = win.querySelector('.window-header');
            let isDragging = false,
                offsetX, offsetY;
            header.addEventListener('mousedown', function(e) {
                if (e.target.closest('.win-btn')) return;
                isDragging = true;
                const rect = win.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
            });
            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                win.style.left = `${e.clientX - offsetX}px`;
                win.style.top = `${e.clientY - offsetY}px`;
            });
            document.addEventListener('mouseup', function() {
                isDragging = false;
            });

            // Touch
            header.addEventListener('touchstart', function(e) {
                if (e.target.closest('.win-btn')) return;
                isDragging = true;
                const rect = win.getBoundingClientRect();
                offsetX = e.touches[0].clientX - rect.left;
                offsetY = e.touches[0].clientY - rect.top;
            }, { passive: false });
            document.addEventListener('touchmove', function(e) {
                if (!isDragging) return;
                e.preventDefault();
                win.style.left = `${e.touches[0].clientX - offsetX}px`;
                win.style.top = `${e.touches[0].clientY - offsetY}px`;
            }, { passive: false });
            document.addEventListener('touchend', function() {
                isDragging = false;
            });

            return win;
        }

        function focusWindow(id) {
            if (activeWindowId === id) return;
            activeWindowId = id;
            document.querySelectorAll('.window').forEach(w => w.classList.remove('focused'));
            const win = document.getElementById(`window-${id}`);
            if (win) {
                win.classList.add('focused');
                win.style.zIndex = ++windowZIndex;
            }
            updateTaskbar();
        }

        function closeWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if (win) {
                win.remove();
                windowCount--;
                delete windows[id];
                if (activeWindowId === id) activeWindowId = null;
                updateTaskbar();
            }
        }

        function minimizeWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if (win) {
                win.style.display = 'none';
                if (activeWindowId === id) {
                    activeWindowId = null;
                    updateTaskbar();
                }
            }
        }

        function maximizeWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if (win) {
                if (win.style.width === '100%') {
                    win.style.width = '500px';
                    win.style.height = '380px';
                    win.style.left = '40px';
                    win.style.top = '40px';
                } else {
                    win.style.width = '100%';
                    win.style.height = 'calc(100% - 28px)';
                    win.style.left = '0';
                    win.style.top = '0';
                }
            }
        }

        function restoreWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if (win && win.style.display === 'none') {
                win.style.display = 'flex';
                focusWindow(id);
            }
        }

        function updateTaskbar() {
            const taskbar = document.getElementById('taskbar-tasks');
            taskbar.innerHTML = '';
            document.querySelectorAll('.window').forEach(win => {
                const id = win.id.replace('window-', '');
                const titleEl = win.querySelector('.window-title');
                const title = titleEl ? titleEl.textContent.trim() : id;
                const task = document.createElement('div');
                task.className = 'taskbar-task';
                if (activeWindowId === id && win.style.display !== 'none') task.classList.add(
                    'active');
                task.textContent = title.substring(0, 18);
                task.onclick = function() {
                    if (win.style.display === 'none') {
                        restoreWindow(id);
                    } else if (activeWindowId === id) {
                        minimizeWindow(id);
                    } else {
                        restoreWindow(id);
                        focusWindow(id);
                    }
                };
                taskbar.appendChild(task);
            });
        }

        // ===== APP CONTENT =====
        function getAppContent(appId) {
            switch (appId) {
                case 'my-pc':
                    return `
                <div style="padding:10px;">
                  <p style="font-size:32px; text-align:center;">🖥️</p>
                  <p style="text-align:center; font-weight:bold;">Мой компьютер</p>
                  <hr style="border:1px solid #808080; margin:8px 0;">
                  <table style="width:100%; font-size:11px;">
                    <tr><td>💾 Локальный диск (C:)</td><td align="right">${Math.round(Math.random()*40+20)}.${Math.round(Math.random()*9)} ГБ свободно из 64 ГБ</td></tr>
                    <tr><td>💿 CD-ROM (D:)</td><td align="right">Нет диска</td></tr>
                    <tr><td>🖨️ Принтеры</td><td align="right">1 устройство</td></tr>
                    <tr><td>🔧 Панель управления</td><td align="right"></td></tr>
                  </table>
                </div>`;
                case 'recycle':
                    return `
                <div style="padding:10px; text-align:center;">
                  <p style="font-size:48px;">🗑️</p>
                  <p style="font-weight:bold;">Корзина</p>
                  <p style="color:#666; font-size:11px;">Корзина пуста</p>
                  <button class="win95-btn" style="margin-top:12px;">Очистить корзину</button>
                </div>`;
                case 'notepad':
                    return `
                <textarea class="notepad-textarea" placeholder="Безымянный — Блокнот">Блокнот Windows Web Edition
        Готов к работе...</textarea>`;
                case 'terminal':
                    return `
                <div style="background:#000; color:#c0c0c0; font-family:'Courier New',monospace; font-size:13px; padding:8px; height:100%; overflow-y:auto;" id="term-output-${appId}">
        Microsoft(R) Windows Web
        (C) Корпорация Майкрософт, 2025. Все права защищены.
        
        C:\\Users\\User><span style="color:#fff;">_</span>
        </div>
                <div style="display:flex; background:#000; padding:4px 8px;">
                  <span style="color:#c0c0c0; font-family:'Courier New',monospace; font-size:13px;">C:\\Users\\User></span>
                  <input type="text" class="win95-input" id="term-input-${appId}" style="flex:1; background:#000; color:#c0c0c0; border:none; box-shadow:none; font-family:'Courier New',monospace; font-size:13px; margin-left:4px;" autofocus>
                </div>`;
                default:
                    return '<p>Приложение не найдено.</p>';
            }
        }

        // ===== OPEN APP =====
        function openApp(appId) {
            if (windows[appId]) {
                const win = document.getElementById(`window-${appId}`);
                if (win && win.style.display === 'none') {
                    restoreWindow(appId);
                    return;
                }
                if (win && activeWindowId !== appId) {
                    focusWindow(appId);
                    return;
                }
                if (win) {
                    focusWindow(appId);
                    return;
                }
            }

            const titles = {
                'my-pc': 'Мой компьютер',
                'recycle': 'Корзина',
                'notepad': 'Блокнот',
                'terminal': 'Командная строка',
            };
            const icons = {
                'my-pc': '🖥️',
                'recycle': '🗑️',
                'notepad': '📝',
                'terminal': '>_',
            };

            const title = titles[appId] || appId;
            const icon = icons[appId] || '📄';
            const win = createWindowElement(appId, title, icon);
            const body = win.querySelector('.window-body');
            body.innerHTML = getAppContent(appId);

            windows[appId] = true;
            focusWindow(appId);
            updateTaskbar();

            if (appId === 'terminal') {
                setupTerminal(appId);
            }

            if (startMenuOpen) toggleStartMenu();
        }

        // ===== TERMINAL =====
        function setupTerminal(appId) {
            const input = document.getElementById(`term-input-${appId}`);
            const output = document.getElementById(`term-output-${appId}`);
            if (!input || !output) return;

            const commands = {
                help: `
        Доступные команды:
          HELP    - эта справка
          DIR     - список файлов
          CLS     - очистить экран
          VER     - версия системы
          DATE    - текущая дата
          TIME    - текущее время
          EXIT    - закрыть окно`,
                dir: `
         Том в устройстве C: Windows
         Серийный номер тома: A1B2-C3D4
        
         Содержимое папки C:\\Users\\User
        
         .            <DIR>         01.01.2025  12:00
         ..           <DIR>         01.01.2025  12:00
         DOCUMENTS    <DIR>         15.03.2025  09:30
         DOWNLOADS    <DIR>         20.06.2025  14:15
         README   TXT             1024  01.01.2025  12:00
         SYSTEM   INI              512  01.01.2025  12:00
                       2 файлов          1 536 байт
                       4 папок    ${Math.round(Math.random()*100+50)} ГБ свободно`,
                ver: `
        Microsoft(R) Windows Web Edition
        Версия 1.0.0 (сборка 2025.1)`,
                date: new Date().toLocaleDateString('ru-RU', { weekday: 'long', year: 'numeric',
                    month: 'long', day: 'numeric' }),
                time: new Date().toLocaleTimeString('ru-RU'),
            };

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const cmd = input.value.trim().toLowerCase();
                    output.innerHTML +=
                        `\nC:\\Users\\User><span style="color:#fff;">${input.value}</span>`;

                    if (cmd === 'cls') {
                        output.innerHTML = '';
                    } else if (cmd === 'exit') {
                        closeWindow(appId);
                    } else if (commands[cmd]) {
                        output.innerHTML += `\n${commands[cmd]}`;
                    } else if (cmd !== '') {
                        output.innerHTML +=
                            `\n"${input.value}" не является внутренней или внешней\nкомандой, исполняемой программой или пакетным файлом.`;
                    }
                    output.innerHTML += '\n\nC:\\Users\\User><span style="color:#fff;">_</span>';
                    output.scrollTop = output.scrollHeight;
                    input.value = '';
                }
            });
        }

        // ===== SHUTDOWN =====
        function shutdown() {
            document.body.innerHTML = `
            <div style="background:#008080; display:flex; align-items:center; justify-content:center; height:100vh; flex-direction:column; color:#fff; font-family:'MS Sans Serif',sans-serif;">
