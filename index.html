<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberOS v1.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Рабочий стол с иконками -->
    <div id="desktop">
        <div class="icon" onclick="openApp('terminal')">
            <div class="icon-pic">📟</div>
            <div class="icon-text">Терминал</div>
        </div>
        <div class="icon" onclick="openApp('store')">
            <div class="icon-pic">🛸</div>
            <div class="icon-text">Маркет</div>
        </div>
    </div>

    <!-- Контейнер для всплывающих окон -->
    <div id="window-layer"></div>

    <!-- Нижняя панель задач -->
    <div id="taskbar">
        <div class="start-btn">🪐 СУПЕР-ОС</div>
        <div id="clock">00:00</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
