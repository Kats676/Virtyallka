<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyOS Ultimate</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: #2b3a4a; font-family: sans-serif; color: white; overflow: hidden; height: 100vh; }
        #desktop { position: absolute; top: 0; left: 0; right: 0; bottom: 60px; padding: 20px; display: flex; gap: 25px; }
        .icon { width: 90px; text-align: center; cursor: pointer; }
        .icon-pic { font-size: 45px; margin-bottom: 5px; }
        .icon-text { font-size: 13px; text-shadow: 0 1px 2px black; }
        .window { position: absolute; width: 360px; height: 280px; background: #1e1e1e; border: 1px solid #444; border-radius: 10px; display: none; flex-direction: column; z-index: 10; touch-action: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .window-header { background: #2d2d2d; padding: 12px; display: flex; justify-content: space-between; align-items: center; cursor: move; border-top-left-radius: 9px; border-top-right-radius: 9px; }
        .close-btn { width: 14px; height: 14px; background: #ff5f56; border-radius: 50%; cursor: pointer; }
        .window-content { padding: 15px; flex-grow: 1; overflow: auto; }
        #taskbar { position: absolute; bottom: 0; left: 0; right: 0; height: 50px; background: #111; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; }
        .start-btn { background: #333; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        #start-menu { position: absolute; bottom: 60px; left: 15px; width: 220px; background: #222; border: 1px solid #444; border-radius: 10px; display: none; flex-direction: column; padding: 5px; z-index: 999; }
        .menu-item { padding: 11px; cursor: pointer; border-radius: 5px; font-size: 14px; }
        .btn { background: #007aff; color: white; border: none; padding: 7px 14px; border-radius: 5px; cursor: pointer; margin-top: 8px; }
        .theme-btn { width: 40px; height: 40px; border-radius: 6px; display: inline-block; margin: 5px; cursor: pointer; border: 2px solid white; }
    </style>
</head>
<body onclick="document.getElementById('start-menu').style.display='none'">

    <div id="desktop">
        <div class="icon" onclick="openApp('win-settings')"><div class="icon-pic">⚙️</div><div class="icon-text">Настройки</div></div>
        <div class="icon" onclick="openApp('win-notes')"><div class="icon-pic">📝</div><div class="icon-text">Блокнот</div></div>
        <div class="icon" onclick="openApp('win-paint')"><div class="icon-pic">🎨</div><div class="icon-text">Paint</div></div>
        <div class="icon" onclick="openApp('win-player')"><div class="icon-pic">🎵</div><div class="icon-text">Плеер</div></div>
    </div>

    <div id="window-layer">
        <div class="window" id="win-settings">
            <div class="window-header" onmousedown="dragStart(event,'win-settings')" ontouchstart="dragStart(event,'win-settings')"><span>Настройки обоев</span><div class="close-btn" onclick="closeApp('win-settings')"></div></div>
            <div class="window-content"><p>Выберите фон:</p>
                <div class="theme-btn" style="background:#2b3a4a" onclick="changeBg('#2b3a4a')"></div>
                <div class="theme-btn" style="background:#4a2b43" onclick="changeBg('#4a2b43')"></div>
                <div class="theme-btn" style="background:#1f3c2b" onclick="changeBg('#1f3c2b')"></div>
            </div>
        </div>

        <div class="window" id="win-notes">
            <div class="window-header" onmousedown="dragStart(event,'win-notes')" ontouchstart="dragStart(event,'win-notes')"><span>Блокнот</span><div class="close-btn" onclick="closeApp('win-notes')"></div></div>
            <div class="window-content">
                <textarea id="note-pad" style="width:100%; height:130px; background:#333; color:white; border:1px solid #555; padding:8px; resize:none; outline:none; border-radius:5px;"></textarea>
                <button class="btn" onclick="saveNote()">Сохранить на диск</button>
            </div>
        </div>

        <div class="window" id="win-paint">
            <div class="window-header" onmousedown="dragStart(event,'win-paint')" ontouchstart="dragStart(event,'win-paint')"><span>Программа Paint</span><div class="close-btn" onclick="closeApp('win-paint')"></div></div>
            <div class="window-content">
                <canvas id="paintCanvas" width="320" height="150" style="background:white; border-radius:5px;"></canvas>
                <button class="btn" onclick="clearCanvas()">Очистить холст</button>
            </div>
        </div>

        <div class="window" id="win-player">
            <div class="window-header" onmousedown="dragStart(event,'win-player')" ontouchstart="dragStart(event,'win-player')"><span>Аудио Плеер</span><div class="close-btn" onclick="closeApp('win-player')"></div></div>
            <div class="window-content"><p>Lo-Fi Радио поток:</p>
                <audio controls src="https://soundhelix.com" style="width:100%; margin-top:15px;"></audio>
            </div>
        </div>
    </div>

    <div id="start-menu">
        <div class="menu-item" onclick="openApp('win-settings')">⚙️ Настройки</div>
        <div class="menu-item" onclick="openApp('win-notes')">📝 Блокнот</div>
        <div class="menu-item" onclick="openApp('win-paint')">🎨 Paint</div>
        <div class="menu-item" onclick="openApp('win-player')">🎵 Плеер</div>
        <div class="menu-item" style="color:#ff453a; border-top:1px solid #444; margin-top:5px;" onclick="shutdownOS()">🛑 Выключить</div>
    </div>

    <div id="taskbar">
        <div class="start-btn" onclick="toggleStartMenu(event)">🚀 Пуск</div>
        <div id="clock">00:00</div>
    </div>

    <script>
        var zIndex = 10, activeWin = null, startX, startY, origX, origY, paintInit = false;
        function toggleStartMenu(e) { e.stopPropagation(); var m = document.getElementById("start-menu"); m.style.display = (m.style.display === "flex") ? "none" : "flex"; }
        function openApp(id) { var w = document.getElementById(id); if(!w) return; zIndex++; w.style.zIndex = zIndex; w.style.display = "flex"; document.getElementById("start-menu").style.display = "none"; if(id === "win-notes") { document.getElementById("note-pad").value = localStorage.getItem("os-note") || ""; } if(id === "win-paint" && !paintInit) { initPaint(); } }
        function closeApp(id) { document.getElementById(id).style.display = "none"; }
        function changeBg(c) { document.body.style.backgroundColor = c; localStorage.setItem("os-bg", c); }
        function saveNote() { localStorage.setItem("os-note", document.getElementById("note-pad").value); alert("Сохранено!"); }
        function shutdownOS() { document.body.innerHTML = "<div style='display:flex;justify-content:center;align-items:center;height:100vh;background:black;color:white;font-size:24px;'>Система выключена.</div>"; }
        function dragStart(e, id) { activeWin = document.getElementById(id); zIndex++; activeWin.style.zIndex = zIndex; var cx = e.clientX || (e.touches && e.touches[0].clientX); var cy = e.clientY || (e.touches && e.touches[0].clientY); startX = cx; startY = cy; origX = activeWin.offsetLeft; origY = activeWin.offsetTop; document.addEventListener("mousemove", dragMove, {passive:false}); document.addEventListener("touchmove", dragMove, {passive:false}); document.addEventListener("mouseup", dragEnd); document.addEventListener("touchend", dragEnd); }
        function dragMove(e) { if(!activeWin) return; var cx = e.clientX || (e.touches && e.touches[0].clientX); var cy = e.clientY || (e.touches && e.touches[0].clientY); activeWin.style.left = (origX + (cx - startX)) + "px"; activeWin.style.top = (origY + (cy - startY)) + "px"; }
        function dragEnd() { activeWin = null; document.removeEventListener("mousemove", dragMove); document.removeEventListener("touchmove", dragMove); }
        function initPaint() { var canvas = document.getElementById("paintCanvas"); var ctx = canvas.getContext("2d"); var draw = false; function start(e) { draw = true; move(e); } function end() { draw = false; ctx.beginPath(); } function move(e) { if(!draw) return; var r = canvas.getBoundingClientRect(); var cx = e.clientX || (e.touches && e.touches[0].clientX); var cy = e.clientY || (e.touches && e.touches[0].clientY); ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.strokeStyle = "black"; ctx.lineTo(cx - r.left, cy - r.top); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx - r.left, cy - r.top); } canvas.addEventListener("mousedown", start); canvas.addEventListener("mouseup", end); canvas.addEventListener("mousemove", move); canvas.addEventListener("touchstart", start); canvas.addEventListener("touchend", end); canvas.addEventListener("touchmove", move); paintInit = true; }
        function clearCanvas() { var canvas = document.getElementById("paintCanvas"); if(canvas) canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height); }
        function clock() { var d = new Date(); var h = d.getHours(), m = d.getMinutes(); document.getElementById("clock").innerText = (h < 10 ? "0" + h : h) + ":" + (m < 10 ? "0" + m : m); }
        window.onload = function() { var bg = localStorage.getItem("os-bg"); if(bg) document.body.style.backgroundColor = bg; setInterval(clock, 1000); clock(); };
    </script>
</body>
</html>
