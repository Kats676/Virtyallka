<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HyraIO</title>
    <style>
        :root {
            --bg: #0a0a1a;
            --taskbar: rgba(10, 15, 30, 0.85);
            --window-bg: rgba(15, 20, 40, 0.95);
            --window-header: rgba(20, 30, 60, 0.95);
            --accent: #4da8ff;
            --danger: #ff5c5c;
            --success: #4dff91;
            --warning: #ffb84d;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #050510;
            height:100vh; width:100vw; overflow:hidden;
            display:flex; flex-direction:column;
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(20,80,200,0.25) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 60%, rgba(15,50,150,0.3) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(10,30,100,0.2) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 80%, rgba(30,100,255,0.15) 0%, transparent 50%),
                linear-gradient(180deg, #050510 0%, #080e25 30%, #0a1030 60%, #060d20 100%);
            background-attachment: fixed;
            transition: background-image 0.5s;
        }
        body.virus-bg {
            background-image: radial-gradient(ellipse at 30% 30%, rgba(255,0,0,0.3) 0%, transparent 60%),
                              radial-gradient(ellipse at 70% 70%, rgba(200,0,0,0.25) 0%, transparent 60%),
                              linear-gradient(180deg, #1a0000 0%, #300000 100%) !important;
        }
        #watermark {
            position:fixed; bottom:50px; right:30px;
            color:rgba(255,255,255,0.05); font-size:80px; font-weight:900;
            letter-spacing:4px; z-index:0; pointer-events:none;
        }
        #desktop { flex:1; position:relative; padding:15px; display:flex; flex-direction:column; gap:6px; z-index:1; }
        .desktop-icon {
            display:flex; flex-direction:column; align-items:center;
            cursor:pointer; padding:8px 6px; width:80px; color:#e0e8ff;
            font-size:11px; gap:4px; border-radius:8px;
        }
        .desktop-icon:hover { background:rgba(77,168,255,0.12); }
        .desktop-icon .icon-img { font-size:28px; }
        .window {
            position:absolute; background:var(--window-bg); border-radius:10px;
            box-shadow:0 20px 60px rgba(0,0,0,0.6); display:flex; flex-direction:column;
            min-width:300px; min-height:200px; z-index:10; overflow:hidden;
            backdrop-filter:blur(20px);
        }
        .window.focused { z-index:100; box-shadow:0 0 0 1.5px var(--accent); }
        .window-header { background:var(--window-header); padding:10px 14px; display:flex; align-items:center; justify-content:space-between; }
        .window-controls button { background:rgba(255,255,255,0.1); border:none; color:#fff; padding:2px 8px; margin-left:4px; border-radius:4px; cursor:pointer; }
        #taskbar { background:var(--taskbar); height:44px; display:flex; align-items:center; padding:0 6px; z-index:200; backdrop-filter:blur(25px); }
        #start-btn { background:var(--accent); border:none; color:#000; padding:6px 14px; border-radius:8px; font-weight:bold; }
        .taskbar-task { background:rgba(255,255,255,0.1); padding:5px 14px; border-radius:6px; margin:0 2px; cursor:pointer; }
        .taskbar-task.active { background:var(--accent); }
        #start-menu { position:absolute; bottom:50px; left:6px; background:rgba(15,20,40,0.95); border-radius:12px; padding:8px; display:none; }
        #start-menu.show { display:block; }
        .start-menu-item { padding:10px; cursor:pointer; color:#ccc; }
        .hyra-btn { background:var(--accent); border:none; color:#000; padding:6px 14px; border-radius:4px; cursor:pointer; }
        .hyra-input { background:rgba(0,0,0,0.4); border:1px solid #555; color:#fff; padding:6px 10px; width:100%; border-radius:4px; }
        .notepad-textarea { width:100%; height:100%; background:#111; color:#0f0; border:1px solid #333; font-family:monospace; }
        .terminal-output { background:#000; color:#0f0; font-family:monospace; padding:10px; height:calc(100% - 30px); overflow-y:auto; }
        .search-result { padding:8px; margin:4px 0; background:rgba(255,255,255,0.05); border-radius:4px; cursor:pointer; }
        .virus-alert { position:fixed; top:20px; right:20px; background:red; color:white; padding:15px 25px; border-radius:8px; z-index:999; display:none; }
    </style>
</head>
<body>
    <div id="watermark">HyraIO</div>
    <div class="virus-alert" id="virusAlert">⚠️ ВИРУС ОБНАРУЖЕН! Система заражена!</div>

    <div id="desktop">
        <div class="desktop-icon" ondblclick="openApp('my-pc')"><div class="icon-img">🖥️</div>Мой компьютер</div>
        <div class="desktop-icon" ondblclick="openApp('recycle')"><div class="icon-img">🗑️</div>Корзина</div>
        <div class="desktop-icon" ondblclick="openApp('notepad')"><div class="icon-img">📝</div>Блокнот</div>
        <div class="desktop-icon" ondblclick="openApp('terminal')"><div class="icon-img">⚡</div>Терминал</div>
        <div class="desktop-icon" ondblclick="openApp('hyrabr')"><div class="icon-img">🌐</div>HYRABR</div>
    </div>

    <div id="start-menu">
        <div class="start-menu-item" onclick="openApp('my-pc');toggleStartMenu()">🖥️ Мой компьютер</div>
        <div class="start-menu-item" onclick="openApp('hyrabr');toggleStartMenu()">🌐 HYRABR</div>
        <div class="start-menu-item" onclick="openApp('terminal');toggleStartMenu()">⚡ Терминал</div>
        <div class="start-menu-item" onclick="shutdown()">⏻ Завершение работы</div>
    </div>

    <div id="taskbar">
        <button id="start-btn" onclick="toggleStartMenu()">⊞ Пуск</button>
        <div id="taskbar-tasks"></div>
        <div id="tray">🕒 <span id="clock"></span></div>
    </div>

    <script>
        // ========== БАЗОВЫЕ ФУНКЦИИ ОКОН ==========
        let windows = {}, windowZIndex = 10, activeWindowId, minimizedWindows = {}, startMenuOpen = false;
        let virusDetected = false;
        let installedAV = null; // название установленного антивируса

        function createWindow(id, title, icon='📄', width='500px', height='400px') {
            const win = document.createElement('div');
            win.className = 'window';
            win.id = 'window-' + id;
            win.style.left = (60 + Object.keys(windows).length*30) + 'px';
            win.style.top = (60 + Object.keys(windows).length*30) + 'px';
            win.style.width = width; win.style.height = height;
            win.style.zIndex = ++windowZIndex;
            win.innerHTML = `
                <div class="window-header">
                    <span>${icon} ${title}</span>
                    <div class="window-controls">
                        <button onclick="minimizeWindow('${id}')">─</button>
                        <button onclick="maximizeWindow('${id}')">□</button>
                        <button onclick="closeWindow('${id}')">✕</button>
                    </div>
                </div>
                <div class="window-body" id="body-${id}"></div>`;
            document.body.appendChild(win);
            windows[id] = true;
            focusWindow(id);
            // перетаскивание
            let drag = false, ox, oy;
            win.querySelector('.window-header').addEventListener('mousedown', e => {
                if(e.target.tagName === 'BUTTON') return;
                drag = true; let r = win.getBoundingClientRect(); ox = e.clientX - r.left; oy = e.clientY - r.top;
            });
            document.addEventListener('mousemove', e => { if(drag) { win.style.left = (e.clientX - ox) + 'px'; win.style.top = (e.clientY - oy) + 'px'; }});
            document.addEventListener('mouseup', ()=> drag=false);
            return win;
        }

        function focusWindow(id) {
            if(activeWindowId === id) return;
            activeWindowId = id;
            document.querySelectorAll('.window').forEach(w => w.classList.remove('focused'));
            document.getElementById('window-'+id)?.classList.add('focused');
            updateTaskbar();
        }
        function closeWindow(id) { document.getElementById('window-'+id)?.remove(); delete windows[id]; updateTaskbar(); }
        function minimizeWindow(id) {
            let w = document.getElementById('window-'+id);
            if(w) { w.style.display = 'none'; minimizedWindows[id]=true; }
            updateTaskbar();
        }
        function maximizeWindow(id) {
            let w = document.getElementById('window-'+id);
            if(w.style.width === '100%') { w.style.width='500px'; w.style.height='400px'; w.style.left='60px'; w.style.top='60px'; }
            else { w.style.width='100%'; w.style.height='calc(100% - 44px)'; w.style.left='0'; w.style.top='0'; }
        }
        function restoreWindow(id) {
            let w = document.getElementById('window-'+id);
            if(w && w.style.display === 'none') { w.style.display = 'flex'; delete minimizedWindows[id]; focusWindow(id); }
        }

        function updateTaskbar() {
            let tasks = document.getElementById('taskbar-tasks');
            tasks.innerHTML = '';
            let all = new Set([...document.querySelectorAll('.window')].map(w=>w.id.replace('window-','')));
            for(let id of all) {
                let btn = document.createElement('div');
                btn.className = 'taskbar-task' + (activeWindowId===id?' active':'');
                btn.innerText = id.replace('my-pc','ПК').replace('hyrabr','HYRABR').replace('notepad','Блокнот').replace('terminal','Терминал');
                btn.onclick = ()=> {
                    if(minimizedWindows[id]) restoreWindow(id);
                    else if(activeWindowId===id) minimizeWindow(id);
                    else { restoreWindow(id); focusWindow(id); }
                };
                tasks.appendChild(btn);
            }
        }

        function toggleStartMenu() {
            startMenuOpen = !startMenuOpen;
            document.getElementById('start-menu').classList.toggle('show', startMenuOpen);
        }

        // Часы
        setInterval(()=> document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);

        // ========== КОНТЕНТ ПРИЛОЖЕНИЙ ==========
        function openApp(appId) {
            if(minimizedWindows[appId]) { restoreWindow(appId); return; }
            if(document.getElementById('window-'+appId)) { focusWindow(appId); return; }
            let title='', icon='', w=500, h=400;
            switch(appId) {
                case 'my-pc': title='Мой компьютер'; icon='🖥️'; break;
                case 'recycle': title='Корзина'; icon='🗑️'; break;
                case 'notepad': title='Блокнот'; icon='📝'; break;
                case 'terminal': title='Терминал'; icon='⚡'; h=350; break;
                case 'hyrabr': title='HYRABR'; icon='🌐'; w=700; h=500; break;
            }
            let win = createWindow(appId, title, icon, w+'px', h+'px');
            let body = document.getElementById('body-'+appId);
            if(appId === 'notepad') body.innerHTML = '<textarea class="notepad-textarea">Блокнот HyraIO</textarea>';
            else if(appId === 'terminal') {
                body.innerHTML = `<div class="terminal-output" id="term-out">C:\\Users\\Hyra><span style="color:#0f0">_</span></div>
                <input class="hyra-input" id="term-inp" style="font-family:monospace; background:#000; color:#0f0;" autofocus>`;
                setupTerminal();
            }
            else if(appId === 'my-pc') {
                body.innerHTML = `<div style="padding:20px"><h2>Устройства и диски</h2>
                <div style="font-size:40px">💾 Локальный диск (C:) HYRIAC</div>
                <button class="hyra-btn" onclick="alert('Диск D: добавлен (заглушка)')">Добавить диск</button></div>`;
            }
            else if(appId === 'recycle') body.innerHTML = '<div style="text-align:center;padding:20px"><span style="font-size:50px">🗑️</span><p>Корзина пуста</p></div>';
            else if(appId === 'hyrabr') buildHyrabr(body);
            updateTaskbar();
            if(startMenuOpen) toggleStartMenu();
        }

        function setupTerminal() {
            let inp = document.getElementById('term-inp'), out = document.getElementById('term-out');
            inp.addEventListener('keydown', e => {
                if(e.key==='Enter') {
                    let cmd = inp.value.trim().toLowerCase();
                    out.innerHTML += `<br>C:\\Users\\Hyra><span style="color:#fff">${inp.value}</span>`;
                    if(cmd==='cls') out.innerHTML = '';
                    else if(cmd==='help') out.innerHTML += '<br>help, cls, ver, date';
                    else out.innerHTML += `<br>"${inp.value}" не найдена`;
                    out.innerHTML += '<br>C:\\Users\\Hyra><span style="color:#0f0">_</span>';
                    inp.value = '';
                }
            });
        }

        // ========== HYRABR БРАУЗЕР ==========
        function buildHyrabr(container) {
            container.innerHTML = `
                <div style="display:flex; margin-bottom:10px">
                    <input class="hyra-input" id="hyrabr-search" placeholder="Поиск или введите URL..." style="flex:1">
                    <button class="hyra-btn" onclick="doSearch()">🔍</button>
                </div>
                <div id="hyrabr-content" style="flex:1; overflow-y:auto;">
                    <p style="text-align:center; color:#888;">Добро пожаловать в HYRABR</p>
                    <p>Попробуйте: <i>погода в Москве, время в Токио, скачать Касперский, читы на Minecraft</i></p>
                </div>`;
            document.getElementById('hyrabr-search').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
        }

        function doSearch() {
            let query = document.getElementById('hyrabr-search').value.trim().toLowerCase();
            let content = document.getElementById('hyrabr-content');
            if(!query) return;

            // Погода
            if(query.startsWith('погода в')) {
                let city = query.replace('погода в','').trim();
                content.innerHTML = `<h3>🌤 Погода в ${city}</h3><p>Температура: +${Math.floor(Math.random()*30)}°C, облачно</p>`;
            }
            // Время
            else if(query.startsWith('время в')) {
                let city = query.replace('время в','').trim();
                content.innerHTML = `<h3>🕒 Время в ${city}</h3><p>${new Date().toLocaleTimeString()}</p>`;
            }
            // Антивирусы
            else if(query.includes('kaspersky') || query.includes('касперский')) {
                content.innerHTML = `<h3>🛡 Kaspersky Antivirus</h3><p>Лидер защиты. <button class="hyra-btn" onclick="installAV('Kaspersky')">Скачать</button></p>`;
            }
            else if(query.includes('dr.web') || query.includes('доктор веб')) {
                content.innerHTML = `<h3>🛡 Dr.Web Security Space</h3><p>Надёжная защита. <button class="hyra-btn" onclick="installAV('Dr.Web')">Скачать</button></p>`;
            }
            else if(query.includes('avast')) {
                content.innerHTML = `<h3>🛡 Avast Free Antivirus</h3><p>Бесплатный. <button class="hyra-btn" onclick="installAV('Avast')">Скачать</button></p>`;
            }
            else if(query.includes('антивирус')) {
                content.innerHTML = `<p>Популярные антивирусы:</p>
                <div class="search-result" onclick="doSearchKaspersky()">🔽 Kaspersky</div>
                <div class="search-result" onclick="doSearchDrWeb()">🔽 Dr.Web</div>`;
            }
            // Читы -> вирус
            else if(query.includes('читы') || query.includes('cheat')) {
                let game = query.replace('читы на','').replace('читы','').trim() || 'любую игру';
                content.innerHTML = `<h3>🎮 Читы для ${game}</h3>
                <p>✅ Бесплатные читы, не обнаруживаются! <span style="color:red">(Вирусов нет)</span></p>
                <button class="hyra-btn" style="background:red; color:white" onclick="downloadVirus('${game}')">Скачать чит-программу</button>`;
            }
            else {
                content.innerHTML = `<p>Результаты по запросу "${query}":</p>
                <div class="search-result">📄 Ссылка 1</div><div class="search-result">📄 Ссылка 2</div>`;
            }
        }

        function doSearchKaspersky() { document.getElementById('hyrabr-search').value = 'Kaspersky'; doSearch(); }
        function doSearchDrWeb() { document.getElementById('hyrabr-search').value = 'Dr.Web'; doSearch(); }

        function installAV(name) {
            installedAV = name;
            virusDetected = false;
            document.body.classList.remove('virus-bg');
            document.getElementById('virusAlert').style.display = 'none';
            alert(`✅ ${name} успешно установлен! Ваша система защищена.`);
            let content = document.getElementById('hyrabr-content');
            content.innerHTML += `<p style="color:green">Установлен ${name}. <button class="hyra-btn" onclick="scanSystem()">Сканировать систему</button></p>`;
        }

        function scanSystem() {
            if(virusDetected) {
                virusDetected = false;
                document.body.classList.remove('virus-bg');
                document.getElementById('virusAlert').style.display = 'none';
                alert('🛡 Вирус удалён! Система очищена.');
            } else {
                alert('✅ Угроз не найдено.');
            }
        }

        function downloadVirus(game) {
            virusDetected = true;
            document.body.classList.add('virus-bg');
            document.getElementById('virusAlert').style.display = 'block';
            alert(`☠️ Вирус "Trojan.${game.replace(/\s/g,'')}" активирован! Ваши данные зашифрованы.`);
            let content = document.getElementById('hyrabr-content');
            content.innerHTML += '<p style="color:red">⚠️ Система заражена. Установите антивирус для лечения.</p>';
        }

        function shutdown() {
            document.body.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100vh; background:#000; color:#fff"><h1>Завершение работы...</h1></div>`;
            setTimeout(()=> location.reload(), 2000);
        }

        // Горячие клавиши
        document.addEventListener('keydown', e => { if(e.key==='Escape' && activeWindowId) minimizeWindow(activeWindowId); });
    </script>
</body>
</html>
