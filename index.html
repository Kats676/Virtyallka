<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyraIO</title>
    <style>
        :root {
            --bg: #0a0a1a;
            --taskbar: rgba(10, 15, 30, 0.85);
            --taskbar-border: rgba(255, 255, 255, 0.08);
            --window-bg: rgba(15, 20, 40, 0.95);
            --window-header: rgba(20, 30, 60, 0.95);
            --window-header-text: #e0e8ff;
            --text: #d0d8f0;
            --accent: #4da8ff;
            --accent-glow: rgba(77, 168, 255, 0.4);
            --btn-hover: rgba(77, 168, 255, 0.15);
            --danger: #ff5c5c;
            --success: #4dff91;
            --warning: #ffb84d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: #050510;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            display: flex;
            flex-direction: column;
            /* Красивые синие обои */
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(20, 80, 200, 0.25) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 60%, rgba(15, 50, 150, 0.3) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(10, 30, 100, 0.2) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 80%, rgba(30, 100, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 10% 90%, rgba(0, 60, 180, 0.2) 0%, transparent 50%),
                linear-gradient(180deg, #050510 0%, #080e25 30%, #0a1030 60%, #060d20 100%);
            background-attachment: fixed;
        }

        /* Лёгкий узор поверх обоев */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 255, 255, 0.003) 2px,
                    rgba(255, 255, 255, 0.003) 4px),
                repeating-linear-gradient(90deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 255, 255, 0.003) 2px,
                    rgba(255, 255, 255, 0.003) 4px);
            pointer-events: none;
            z-index: 0;
        }

        /* Логотип HyraIO на рабочем столе */
        #watermark {
            position: fixed;
            bottom: 50px;
            right: 30px;
            color: rgba(255, 255, 255, 0.06);
            font-size: 80px;
            font-weight: 900;
            letter-spacing: 4px;
            z-index: 0;
            pointer-events: none;
            font-family: 'Segoe UI', sans-serif;
            text-transform: uppercase;
        }

        /* ===== DESKTOP ===== */
        #desktop {
            flex: 1;
            position: relative;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 1;
        }

        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 8px 6px;
            width: 80px;
            text-align: center;
            color: #e0e8ff;
            font-size: 11px;
            gap: 4px;
            border-radius: 8px;
            transition: all 0.15s;
            position: relative;
            z-index: 1;
        }
        .desktop-icon:hover {
            background: rgba(77, 168, 255, 0.12);
            backdrop-filter: blur(8px);
        }
        .desktop-icon:active {
            background: rgba(77, 168, 255, 0.2);
        }
        .desktop-icon .icon-img {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
            transition: transform 0.15s;
        }
        .desktop-icon:hover .icon-img {
            transform: scale(1.08);
        }
        .desktop-icon .icon-label {
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
            line-height: 1.3;
            word-wrap: break-word;
            max-width: 75px;
        }

        /* ===== WINDOWS ===== */
        .window {
            position: absolute;
            background: var(--window-bg);
            border-radius: 10px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            min-width: 300px;
            min-height: 200px;
            z-index: 10;
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: windowOpen 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes windowOpen {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(15px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .window.focused {
            z-index: 100;
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.7),
                0 0 0 1.5px var(--accent-glow),
                0 0 20px rgba(77, 168, 255, 0.1);
        }

        .window-header {
            background: var(--window-header);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: default;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 38px;
        }
        .window-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
            color: #c0d0f0;
        }
        .window-title .win-icon {
            font-size: 14px;
        }
        .window-controls {
            display: flex;
            gap: 6px;
        }
        .win-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c0d0f0;
            background: rgba(255, 255, 255, 0.04);
            transition: all 0.15s;
        }
        .win-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .win-btn.close:hover {
            background: var(--danger);
            color: #fff;
        }
        .win-btn.minimize:hover {
            background: var(--warning);
            color: #000;
        }
        .win-btn.maximize:hover {
            background: var(--success);
            color: #000;
        }

        .window-body {
            flex: 1;
            padding: 14px;
            overflow: auto;
            font-size: 13px;
            color: #c0d0f0;
            line-height: 1.5;
        }
        .window-body::-webkit-scrollbar {
            width: 5px;
        }
        .window-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .window-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        /* ===== TASKBAR ===== */
        #taskbar {
            background: var(--taskbar);
            height: 44px;
            display: flex;
            align-items: center;
            padding: 0 6px;
            gap: 4px;
            z-index: 200;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid var(--taskbar-border);
        }
        #start-btn {
            background: rgba(77, 168, 255, 0.15);
            border: 1px solid rgba(77, 168, 255, 0.2);
            color: #e0e8ff;
            font-weight: 600;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            height: 32px;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }
        #start-btn:hover {
            background: rgba(77, 168, 255, 0.25);
            box-shadow: 0 0 15px rgba(77, 168, 255, 0.15);
        }
        #start-btn:active {
            background: rgba(77, 168, 255, 0.35);
            transform: scale(0.97);
        }
        #taskbar-tasks {
            display: flex;
            gap: 3px;
            flex: 1;
            overflow-x: auto;
            height: 34px;
            align-items: center;
        }
        #taskbar-tasks::-webkit-scrollbar {
            height: 2px;
        }
        #taskbar-tasks::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        .taskbar-task {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #c0d0f0;
            padding: 5px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            white-space: nowrap;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 30px;
            display: flex;
            align-items: center;
            transition: all 0.15s;
            gap: 6px;
        }
        .taskbar-task:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .taskbar-task.active {
            background: rgba(77, 168, 255, 0.2);
            border-color: rgba(77, 168, 255, 0.4);
            color: #fff;
            font-weight: 500;
        }
        .taskbar-task .task-icon {
            font-size: 13px;
        }
        #tray {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
            height: 30px;
            font-size: 11px;
            color: #b0c0e0;
            white-space: nowrap;
        }
        #tray .tray-time {
            font-weight: 500;
        }
        #tray .tray-date {
            color: #8090b0;
            font-size: 10px;
        }

        /* ===== START MENU ===== */
        #start-menu {
            position: absolute;
            bottom: 50px;
            left: 6px;
            background: rgba(15, 20, 40, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 12px;
            padding: 8px;
            display: none;
            min-width: 220px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 300;
            animation: slideUp 0.15s ease-out;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        #start-menu.show {
            display: block;
        }
        .start-menu-item {
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #c0d0f0;
            transition: all 0.1s;
        }
        .start-menu-item:hover {
            background: rgba(77, 168, 255, 0.15);
            color: #fff;
        }
        .start-menu-item .smi-icon {
            width: 22px;
            text-align: center;
            font-size: 15px;
        }
        .start-menu-separator {
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
            margin: 4px 8px;
        }
        .start-menu-footer {
            padding: 8px 14px;
            font-size: 10px;
            color: #6070a0;
            text-align: center;
            letter-spacing: 1px;
        }

        /* ===== BUTTONS ===== */
        .hyra-btn {
            background: rgba(77, 168, 255, 0.15);
            border: 1px solid rgba(77, 168, 255, 0.25);
            color: #d0e0ff;
            padding: 7px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            transition: all 0.15s;
        }
        .hyra-btn:hover {
            background: rgba(77, 168, 255, 0.25);
        }
        .hyra-btn:active {
            background: rgba(77, 168, 255, 0.35);
        }

        /* ===== INPUT ===== */
        .hyra-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e0e8ff;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
            width: 100%;
        }
        .hyra-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(77, 168, 255, 0.1);
        }

        /* ===== NOTEPAD ===== */
        .notepad-textarea {
            width: 100%;
            height: 100%;
            min-height: 180px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: #d0d8f0;
            padding: 10px;
            font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            line-height: 1.6;
        }
        .notepad-textarea:focus {
            border-color: var(--accent);
        }

        /* ===== TERMINAL ===== */
        .terminal-output {
            background: rgba(0, 0, 0, 0.4);
            color: #b0d0ff;
            font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
            font-size: 13px;
            padding: 10px;
            height: calc(100% - 35px);
            overflow-y: auto;
            white-space: pre-wrap;
            border-radius: 6px 6px 0 0;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-bottom: none;
            line-height: 1.5;
        }
        .terminal-input-line {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 10px;
            border-radius: 0 0 6px 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-top: none;
            align-items: center;
        }
        .terminal-prompt {
            color: var(--accent);
            font-family: 'Consolas', 'Fira Code', monospace;
            font-size: 13px;
            margin-right: 6px;
            white-space: nowrap;
        }
        .terminal-input {
            background: transparent;
            border: none;
            color: #e0e8ff;
            font-family: 'Consolas', 'Fira Code', monospace;
            font-size: 13px;
            outline: none;
            flex: 1;
            caret-color: var(--accent);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            #watermark {
                font-size: 40px;
                bottom: 55px;
                right: 10px;
            }
            .window {
                min-width: 250px;
                min-height: 160px;
            }
            #taskbar {
                height: 38px;
            }
            #start-btn {
                font-size: 11px;
                padding: 4px 10px;
                height: 28px;
            }
            .taskbar-task {
                font-size: 10px;
                padding: 4px 10px;
                height: 26px;
                max-width: 100px;
            }
        }
    </style>
</head>
<body>

    <!-- Watermark -->
    <div id="watermark">HyraIO</div>

    <!-- Desktop -->
    <div id="desktop">
        <div class="desktop-icon" data-app="my-pc" ondblclick="openApp('my-pc')">
            <div class="icon-img">🖥️</div>
            <div class="icon-label">Этот компьютер</div>
        </div>
        <div class="desktop-icon" data-app="recycle" ondblclick="openApp('recycle')">
            <div class="icon-img">🗑️</div>
            <div class="icon-label">Корзина</div>
        </div>
        <div class="desktop-icon" data-app="notepad" ondblclick="openApp('notepad')">
            <div class="icon-img">📝</div>
            <div class="icon-label">Блокнот</div>
        </div>
        <div class="desktop-icon" data-app="terminal" ondblclick="openApp('terminal')">
            <div class="icon-img">⚡</div>
            <div class="icon-label">Терминал</div>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu">
        <div class="start-menu-item" onclick="openApp('my-pc'); toggleStartMenu()">
            <span class="smi-icon">🖥️</span> Этот компьютер
        </div>
        <div class="start-menu-item" onclick="openApp('notepad'); toggleStartMenu()">
            <span class="smi-icon">📝</span> Блокнот
        </div>
        <div class="start-menu-item" onclick="openApp('terminal'); toggleStartMenu()">
            <span class="smi-icon">⚡</span> Терминал
        </div>
        <div class="start-menu-separator"></div>
        <div class="start-menu-item" onclick="shutdown()">
            <span class="smi-icon">⏻</span> Завершение работы
        </div>
        <div class="start-menu-footer">HyraIO v1.0</div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <button id="start-btn" onclick="toggleStartMenu()">
            <span>⊞</span> Пуск
        </button>
        <div id="taskbar-tasks"></div>
        <div id="tray">
            <span class="tray-time" id="clock">00:00</span>
            <span class="tray-date" id="date-display"></span>
        </div>
    </div>

    <script>
        // ==================== HyraIO OS ====================

        let windows = {};
        let windowZIndex = 10;
        let activeWindowId = null;
        let windowCount = 0;
        let startMenuOpen = false;
        let minimizedWindows = {};

        // ===== CLOCK =====
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const d = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
            document.getElementById('clock').textContent = `${h}:${m}`;
            document.getElementById('date-display').textContent = d;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ===== START MENU =====
        function toggleStartMenu() {
            startMenuOpen = !startMenuOpen;
            const menu = document.getElementById('start-menu');
            if (startMenuOpen) {
                menu.classList.add('show');
            } else {
                menu.classList.remove('show');
            }
        }

        document.addEventListener('click', function(e) {
            const menu = document.getElementById('start-menu');
            const startBtn = document.getElementById('start-btn');
            if (startMenuOpen && !menu.contains(e.target) && e.target !== startBtn) {
                startMenuOpen = false;
                menu.classList.remove('show');
            }
        });

        // ===== WINDOW MANAGEMENT =====
        function createWindowElement(id, title, icon = '📄') {
            const win = document.createElement('div');
            win.className = 'window';
            win.id = `window-${id}`;
            win.style.left = `${50 + (windowCount * 30) % 350}px`;
            win.style.top = `${50 + (windowCount * 30) % 250}px`;
            win.style.width = '520px';
            win.style.height = '400px';
            win.style.zIndex = ++windowZIndex;
            win.innerHTML = `
            <div class="window-header" data-window-id="${id}">
              <span class="window-title"><span class="win-icon">${icon}</span> ${title}</span>
              <div class="window-controls">
                <button class="win-btn minimize" data-action="minimize" title="Свернуть">─</button>
                <button class="win-btn maximize" data-action="maximize" title="Развернуть">□</button>
                <button class="win-btn close" data-action="close" title="Закрыть">✕</button>
              </div>
            </div>
            <div class="window-body" id="body-${id}"></div>
          `;
            document.body.appendChild(win);
            windowCount++;

            win.querySelectorAll('.win-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const action = this.dataset.action;
                    if (action === 'close') closeWindow(id);
                    if (action === 'minimize') minimizeWindow(id);
                    if (action === 'maximize') maximizeWindow(id);
                });
            });

            win.addEventListener('mousedown', function() {
                focusWindow(id);
            });

            // Dragging
            const header = win.querySelector('.window-header');
            let isDragging = false,
                offsetX, offsetY;
            header.addEventListener('mousedown', function(e) {
                if (e.target.closest('.win-btn')) return;
                isDragging = true;
                const rect = win.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
            });
            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                win.style.left = `${e.clientX - offsetX}px`;
                win.style.top = `${e.clientY - offsetY}px`;
            });
            document.addEventListener('mouseup', function() {
                isDragging = false;
            });

            // Touch
            header.addEventListener('touchstart', function(e) {
                if (e.target.closest('.win-btn')) return;
                isDragging = true;
                const rect = win.getBoundingClientRect();
                offsetX = e.touches[0].clientX - rect.left;
                offsetY = e.touches[0].clientY - rect.top;
            }, { passive: false });
            document.addEventListener('touchmove', function(e) {
                if (!isDragging) return;
                e.preventDefault();
                win.style.left = `${e.touches[0].clientX - offsetX}px`;
                win.style.top = `${e.touches[0].clientY - offsetY}px`;
            }, { passive: false });
            document.addEventListener('touchend', function() {
                isDragging = false;
            });

            return win;
        }

        function focusWindow(id) {
            if (activeWindowId === id) return;
            activeWindowId = id;
            document.querySelectorAll('.window').forEach(w => w.classList.remove('focused'));
            const win = document.getElementById(`window-${id}`);
            if (win) {
                win.classList.add('focused');
                win.style.zIndex = ++windowZIndex;
            }
            updateTaskbar();
        }

        function closeWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if (win) {
                win.remove();
                windowCount--;
                delete windows[id];
                delete minimizedWindows[id];
                if (activeWindowId === id) activeWindowId = null;
                updateTaskbar();
            }
        }

        function minimizeWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if (win) {
                win.style.display = 'none';
                minimizedWindows[id] = true;
                if (activeWindowId === id) {
                    activeWindowId = null;
                }
                updateTaskbar();
            }
        }

        function maximizeWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if (win) {
                if (win.style.width === '100%') {
                    win.style.width = '520px';
                    win.style.height = '400px';
                    win.style.left = '50px';
                    win.style.top = '50px';
                    win.style.borderRadius = '10px';
                } else {
                    win.style.width = '100%';
                    win.style.height = 'calc(100% - 44px)';
                    win.style.left = '0';
                    win.style.top = '0';
                    win.style.borderRadius = '0';
                }
            }
        }

        function restoreWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if (win && win.style.display === 'none') {
                win.style.display = 'flex';
                delete minimizedWindows[id];
                focusWindow(id);
                updateTaskbar();
            }
        }

        function updateTaskbar() {
            const taskbar = document.getElementById('taskbar-tasks');
            taskbar.innerHTML = '';

            // Получаем все окна (и открытые, и свёрнутые)
            const allWindowIds = new Set();
            document.querySelectorAll('.window').forEach(win => {
                allWindowIds.add(win.id.replace('window-', ''));
            });
            // Добавляем свёрнутые, которых может не быть в DOM
            Object.keys(minimizedWindows).forEach(id => allWindowIds.add(id));

            allWindowIds.forEach(id => {
                const win = document.getElementById(`window-${id}`);
                let title = id;
                let icon = '📄';
                if (win) {
                    const titleEl = win.querySelector('.window-title');
                    if (titleEl) {
                        const iconEl = titleEl.querySelector('.win-icon');
                        if (iconEl) icon = iconEl.textContent;
                        title = titleEl.textContent.replace(icon, '').trim();
                    }
                } else if (windows[id]) {
                    // Свёрнутое окно
                    const icons = {
                        'my-pc': '🖥️',
                        'recycle': '🗑️',
                        'notepad': '📝',
                        'terminal': '⚡'
                    };
                    const titles = {
                        'my-pc': 'Этот компьютер',
                        'recycle': 'Корзина',
                        'notepad': 'Блокнот',
                        'terminal': 'Терминал'
                    };
                    icon = icons[id] || '📄';
                    title = titles[id] || id;
                }

                const isMinimized = minimizedWindows[id];
                const isActive = activeWindowId === id && !isMinimized;

                const task = document.createElement('div');
                task.className = 'taskbar-task';
                if (isActive) task.classList.add('active');
                task.innerHTML = `<span class="task-icon">${icon}</span> ${title.substring(0, 16)}`;
                task.title = title;

                task.onclick = function() {
                    if (isMinimized) {
                        // Если свёрнуто — восстанавливаем
                        restoreWindow(id);
                    } else if (isActive) {
                        // Если активно — сворачиваем
                        minimizeWindow(id);
                    } else {
                        // Иначе — фокусируем
                        restoreWindow(id);
                        focusWindow(id);
                    }
                };

                taskbar.appendChild(task);
            });
        }

        // ===== APP CONTENT =====
        function getAppContent(appId) {
            switch (appId) {
                case 'my-pc':
                    return `
                <div style="padding:8px;">
                  <p style="font-size:36px; text-align:center;">🖥️</p>
                  <p style="text-align:center; font-weight:600; font-size:15px; color:#e0e8ff;">Этот компьютер</p>
                  <div style="margin-top:14px; background:rgba(0,0,0,0.2); border-radius:8px; padding:12px;">
                    <table style="width:100%; font-size:12px; border-collapse:collapse;">
                      <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                        <td style="padding:6px;">💾 Локальный диск (C:)</td>
                        <td style="padding:6px; text-align:right; color:#8090b0;">${Math.round(Math.random()*40+20)}.${Math.round(Math.random()*9)} ГБ свободно из 128 ГБ</td>
                      </tr>
                      <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                        <td style="padding:6px;">💿 DVD-дисковод (D:)</td>
                        <td style="padding:6px; text-align:right; color:#8090b0;">Нет диска</td>
                      </tr>
                      <tr>
                        <td style="padding:6px;">🔧 Панель управления</td>
                        <td style="padding:6px; text-align:right;"></td>
                      </tr>
                    </table>
                  </div>
                  <p style="font-size:10px; color:#506080; margin-top:12px; text-align:center;">HyraIO — Этот компьютер</p>
                </div>`;
                case 'recycle':
                    return `
                <div style="padding:10px; text-align:center;">
                  <p style="font-size:52px;">🗑️</p>
                  <p style="font-weight:600; font-size:14px;">Корзина</p>
                  <p style="color:#6070a0; font-size:11px; margin-top:8px;">Корзина пуста</p>
                  <button class="hyra-btn" style="margin-top:16px;">Очистить корзину</button>
                </div>`;
                case 'notepad':
                    return `
                <textarea class="notepad-textarea" placeholder="Безымянный — Блокнот">Блокнот HyraIO
        Готов к работе...</textarea>`;
                case 'terminal':
                    return `
                <div style="display:flex; flex-direction:column; height:100%;">
                  <div class="terminal-output" id="term-output-${appId}">
        ⚡ HyraIO Terminal v1.0
        ─────────────────────────────
        Введите 'help' для списка команд.
        
        C:\\Users\\Hyra><span style="color:var(--accent);">_</span>
                  </div>
                  <div class="terminal-input-line">
                    <span class="terminal-prompt">C:\\Users\\Hyra></span>
                    <input type="text" class="terminal-input" id="term-input-${appId}" autofocus>
                  </div>
                </div>`;
                default:
                    return '<p>Приложение не найдено.</p>';
            }
        }

        // ===== OPEN APP =====
        function openApp(appId) {
            // Если окно существует и свёрнуто — восстанавливаем
            if (minimizedWindows[appId]) {
                restoreWindow(appId);
                return;
            }

            // Если окно уже открыто — фокусируем
            if (windows[appId]) {
                const win = document.getElementById(`window-${appId}`);
                if (win && win.style.display !== 'none' && activeWindowId !== appId) {
                    focusWindow(appId);
                    return;
                }
                if (win && win.style.display !== 'none') {
                    focusWindow(appId);
                    return;
                }
            }

            const titles = {
                'my-pc': 'Этот компьютер',
                'recycle': 'Корзина',
                'notepad': 'Блокнот',
                'terminal': 'Терминал',
            };
            const icons = {
                'my-pc': '🖥️',
                'recycle': '🗑️',
                'notepad': '📝',
                'terminal': '⚡',
            };

            const title = titles[appId] || appId;
            const icon = icons[appId] || '📄';
            const win = createWindowElement(appId, title, icon);
            const body = win.querySelector('.window-body');
            body.innerHTML = getAppContent(appId);

            windows[appId] = true;
            delete minimizedWindows[appId];
            focusWindow(appId);
            updateTaskbar();

            if (appId === 'terminal') {
                setupTerminal(appId);
            }

            if (startMenuOpen) toggleStartMenu();
        }

        // ===== TERMINAL =====
        function setupTerminal(appId) {
            const input = document.getElementById(`term-input-${appId}`);
            const output = document.getElementById(`term-output-${appId}`);
            if (!input || !output) return;

            const commands = {
                help: `
        Доступные команды:
          HELP    — эта справка
          DIR     — список файлов
          CLS     — очистить экран
          VER     — версия системы
          DATE    — текущая дата
          TIME    — текущее время
          EXIT    — закрыть окно`,
                dir: `
         Том в устройстве C: HyraIO
         Серийный номер тома: HRA1-IO25
        
         Содержимое папки C:\\Users\\Hyra
        
         .            <DIR>         01.06.2025  12:00
         ..           <DIR>         01.06.2025  12:00
         DOCUMENTS    <DIR>         15.06.2025  09:30
         DOWNLOADS    <DIR>         20.06.2025  14:15
         PICTURES     <DIR>         22.06.2025  18:45
         README   TXT             2048  01.06.2025  12:00
         CONFIG   INI              256  10.06.2025  08:00
                       2 файлов          2 304 байт
                       5 папок    ${Math.round(Math.random()*80+40)} ГБ свободно`,
                ver: `
        HyraIO OS
        Версия 1.0.0 (сборка 2025.06)
        (C) HyraIO. Все права защищены.`,
                date: new Date().toLocaleDateString('ru-RU', { weekday: 'long', year: 'numeric',
                    month: 'long', day: 'numeric' }),
                time: new Date().toLocaleTimeString('ru-RU'),
            };

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const cmd = input.value.trim().toLowerCase();
                    output.innerHTML +=
                        `\nC:\\Users\\Hyra><span style="color:#fff;">${input.value}</span>`;

                    if (cmd === 'cls') {
                        output.innerHTML = '';
                    } else if (cmd === 'exit') {
                        closeWindow(appId);
                    } else if (commands[cmd]) {
                        output.innerHTML += `\n${commands[cmd]}`;
                    } else if (cmd !== '') {
                        output.innerHTML +=
                            `\n"${input.value}" не является внутренней или внешней\nкомандой, исполняемой программой или пакетным файлом.`;
                    }
                    output.innerHTML += '\n\nC:\\Users\\Hyra><span style="color:var(--accent);">_</span>';
                    output.scrollTop = output.scrollHeight;
                    input.value = '';
                }
            });
        }

        // ===== SHUTDOWN =====
        function shutdown() {
            document.body.innerHTML = `
            <div style="background:#050510; display:flex; align-items:center; justify-content:center; height:100vh; flex-direction:column; color:#e0e8ff; font-family:'Segoe UI',sans-serif;
              background-image: radial-gradient(ellipse at 50% 50%, rgba(20,80,200,0.2) 0%, transparent 70%);">
              <div style="background:rgba(15,20,40,0.9); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.06); border-radius:16px; padding:40px; text-align:center; box-shadow:0 30px 60px rgba(0,0,0,0.5);">
                <p style="font-size:48px; margin-bottom:12px;">⏻</p>
                <p style="font-weight:600; font-size:16px;">Завершение работы HyraIO</p>
                <p style="font-size:11px; color:#6070a0; margin-top:10px;">Теперь питание компьютера можно отключить.</p>
                <button class="hyra-btn" style="margin-top:20px;" onclick="location.reload()">Перезапустить HyraIO</button>
              </div>
              <p style="position:fixed; bottom:40px; right:30px; color:rgba(255,255,255,0.04); font-size:60px; font-weight:900;">HyraIO</p>
            </div>`;
        }

        // ===== KEYBOARD =====
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && activeWindowId) {
                minimizeWindow(activeWindowId);
            }
        });

        // ===== CLICK OUTSIDE START MENU =====
        document.addEventListener('click', function(e) {
            if (startMenuOpen && !document.getElementById('start-menu').contains(e.target) && e.target !==
                document.getElementById('start-btn')) {
                startMenuOpen = false;
                document.getElementById('start-menu').classList.remove('show');
            }
        });

        // ===== INITIAL =====
        console.log('%c⚡ HyraIO OS %cv1.0.0',
            'font-size:18px; color:#4da8ff;', 'color:#c0d0f0;');
        console.log('%cДважды кликните по иконкам на рабочем столе.', 'color:#8090b0;');
        console.log('%cEsc — свернуть окно', 'color:#8090b0;');

        // Автооткрытие при загрузке
        setTimeout(() => {
            openApp('my-pc');
        }, 500);
    </script>
</body>
</html>
